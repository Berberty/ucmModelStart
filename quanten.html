#ucm-q{
  --bg:#e9edf4; --grid:#dbe2ee; --paper:#ffffff; --ink:#121b33; --ink2:#525f7b; --line:#cfd7e6;
  --lamp:#ffc52e; --lamp-edge:#cf9500; --lamp-ink:#221900;
  --el:#1d57d6; --el-soft:#e4ecff;
  --ok:#147a4b; --ok-bg:#dff3e7; --no:#bd2f2f; --no-bg:#fbe5e3; --warn-bg:#fff1c7; --warn:#8a5a00;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a; --bench-ink:#d4dcf0; --bench-ink2:#8f9cc0;
  --f-display:"Barlow Condensed","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","DIN Alternate","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  position:relative;text-align:left;color:var(--ink);font:400 17px/1.45 var(--f-body);letter-spacing:normal;
  background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  border-radius:14px;overflow:clip;-webkit-text-size-adjust:100%}
#ucm-q *{box-sizing:border-box}
#ucm-q [hidden]{display:none!important}
#ucm-q h1,#ucm-q h2,#ucm-q h3,#ucm-q p{margin:0;padding:0;color:inherit;letter-spacing:inherit;text-transform:none}
#ucm-q b,#ucm-q strong{font-weight:600}
#ucm-q button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
#ucm-q :focus-visible{outline:3px solid var(--el);outline-offset:2px;border-radius:6px}
#ucm-q a{color:var(--el)}

/* Kopfzeile */
#ucm-q .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
#ucm-q .logo{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
#ucm-q .logo svg{width:26px;height:26px;flex:none}
#ucm-q .chain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
#ucm-q .chain button{position:relative;padding:6px 0;width:38px;flex:0 1 38px;min-width:22px;display:flex;justify-content:center}
#ucm-q .chain button::before{content:"";position:absolute;left:-50%;right:50%;top:16px;height:2px;background:var(--ink2);opacity:.55}
#ucm-q .chain button:first-child::before{display:none}
#ucm-q .chain svg{position:relative;width:22px;height:22px;overflow:visible}
#ucm-q .chain .cf{fill:var(--paper);stroke:var(--ink2);stroke-width:1.6;transition:fill .4s}
#ucm-q .chain .ch{stroke:var(--ink2);stroke-width:1.8;stroke-linecap:round}
#ucm-q .chain .is-done .cf{fill:var(--lamp);stroke:var(--lamp-edge)}
#ucm-q .chain .is-done .ch{stroke:var(--lamp-ink)}
#ucm-q .chain .is-cur .cf{stroke:var(--el);stroke-width:2.6}
#ucm-q .chain .is-cur::after{content:"";position:absolute;bottom:-2px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--el)}
#ucm-q .readout{display:flex;align-items:center;gap:10px}
#ucm-q .pts{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
#ucm-q .lang{display:flex;gap:2px}
#ucm-q .lang button{font:700 14px/1 var(--f-display);letter-spacing:.08em;padding:6px 7px;border-radius:7px;color:var(--ink2)}
#ucm-q .lang button.on{background:var(--el-soft);color:var(--el)}

#ucm-q .main{max-width:1140px;margin:0 auto;padding:18px 16px 40px}

/* Start */
#ucm-q .start{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
#ucm-q .eyebrow{font:600 14px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
#ucm-q .start h1{font:700 clamp(46px,8.5vw,84px)/.86 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin-top:6px}
#ucm-q .start h1 span{color:var(--el);display:block}
#ucm-q .lead{font-size:18.5px;max-width:34em;margin-top:12px}
#ucm-q .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font:600 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
#ucm-q .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
#ucm-q .card h2{font:700 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
#ucm-q .note{font-size:14.5px;color:var(--ink2);line-height:1.4}

/* Station */
#ucm-q .st-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
#ucm-q .st-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#ucm-q .st-no{font:700 54px/.82 var(--f-display);color:var(--el);font-variant-numeric:tabular-nums}
#ucm-q .st-head h2{font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
#ucm-q .st-sub{color:var(--ink2);font-size:16px}
#ucm-q .tags{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
#ucm-q .tag{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;border-radius:99px;background:var(--el-soft);font-size:14.5px}
#ucm-q .tag i{font:600 12.5px var(--f-display);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
#ucm-q .tag.k{background:#e4ecff} #ucm-q .tag.g{background:var(--ok-bg)} #ucm-q .tag.m{background:var(--warn-bg)}

#ucm-q .work{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#ucm-q .scene{background:var(--bench);color:var(--bench-ink);border-radius:14px;padding:8px;border:1px solid var(--bench3);display:flex;flex-direction:column;gap:6px;min-width:0}
#ucm-q .scene canvas{display:block;width:100%;height:auto;touch-action:manipulation}
#ucm-q .sc-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:2px 6px 6px}
#ucm-q .sc-cap{font-size:13.5px;line-height:1.35;color:var(--bench-ink2);padding:0 8px 6px;text-align:center}
#ucm-q .sc-row label{display:flex;gap:8px;align-items:center;font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--bench-ink2)}
#ucm-q .sc-row input[type=range]{width:150px;height:30px;accent-color:var(--lamp)}

#ucm-q .task{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
#ucm-q .task-meta{display:flex;justify-content:space-between;gap:10px;font:600 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
#ucm-q .task p{line-height:1.45}
#ucm-q .q{font-size:19px;line-height:1.36;font-weight:600}
#ucm-q .split{height:1px;background:var(--line)}

#ucm-q .opts{display:grid;gap:9px}
#ucm-q .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--paper);line-height:1.38;transition:border-color .2s,background .2s}
#ucm-q .opt:hover{border-color:var(--el)}
#ucm-q .opt-k{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--el-soft);font:700 17px/1 var(--f-display)}
#ucm-q .opt-t{flex:1;min-width:0;padding-top:2px}
#ucm-q .opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
#ucm-q .opt.is-no{border-color:var(--no);background:var(--no-bg)}
#ucm-q .opt.is-ok .opt-k{background:var(--ok);color:#fff}
#ucm-q .opt.is-no .opt-k{background:var(--no);color:#fff}
#ucm-q .opt.is-dim{opacity:.5}
#ucm-q .opt[aria-disabled="true"]{cursor:default}

#ucm-q .fb{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border-left:6px solid var(--el);background:var(--el-soft);line-height:1.42;font-size:16px}
#ucm-q .fb .fb-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--el);color:#fff;margin-top:1px}
#ucm-q .fb.ok{border-color:var(--ok);background:var(--ok-bg)} #ucm-q .fb.ok .fb-i{background:var(--ok)}
#ucm-q .fb.no{border-color:var(--no);background:var(--no-bg)} #ucm-q .fb.no .fb-i{background:var(--no)}
#ucm-q .fb .fb-p{display:block;font:700 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
#ucm-q .fb.ok .fb-p{color:var(--ok)} #ucm-q .fb.no .fb-p{color:var(--no)}
#ucm-q .fb b.n{color:var(--el)}

#ucm-q details{border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:15.5px;line-height:1.45}
#ucm-q details[open]{background:#fafbfd}
#ucm-q summary{cursor:pointer;font:700 15px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--el);list-style-position:inside}
#ucm-q details p{margin-top:8px}
#ucm-q .f{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;white-space:nowrap;font-size:1.05em}

#ucm-q .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#ucm-q .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:12px;border:2px solid var(--lamp-edge);background:var(--lamp);color:var(--lamp-ink);font:700 19px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#ucm-q .btn:active{transform:translateY(1px)}
#ucm-q .btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
#ucm-q .btn.plain{background:none;border-color:transparent;color:var(--ink2);padding-left:6px;padding-right:6px}
#ucm-q .btn.small{min-height:40px;padding:6px 14px;font-size:16px}
#ucm-q .btn.onbench{min-height:40px;padding:6px 14px;font-size:16px;background:var(--bench2);border-color:var(--bench3);color:var(--bench-ink)}
#ucm-q .btn.onbench[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}

/* Auswertung */
#ucm-q .sum{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#ucm-q .score{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#ucm-q .score svg{width:190px;height:190px}
#ucm-q .ring-bg{fill:none;stroke:var(--line);stroke-width:14}
#ucm-q .ring{fill:none;stroke:var(--lamp);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s}
#ucm-q .big{font:700 46px var(--f-display);fill:var(--ink)}
#ucm-q .of{font:600 15px var(--f-display);letter-spacing:.1em;fill:var(--ink2)}
#ucm-q .srow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
#ucm-q .srow:first-of-type{border-top:0}
#ucm-q .srow .n{font:700 28px/1 var(--f-display);color:var(--el)}
#ucm-q .srow .t{font-weight:600;line-height:1.25;text-align:left}
#ucm-q .srow .p{font:700 19px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
#ucm-q .bar{grid-column:2 / 4;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#ucm-q .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
#ucm-q .box{border-left:6px solid var(--el);background:var(--el-soft);border-radius:12px;padding:12px 14px}
#ucm-q .box.o{border-color:var(--lamp-edge);background:var(--warn-bg)}
#ucm-q .box h3,#ucm-q .card h3{font:700 15px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
#ucm-q ul{margin:.3em 0;padding-left:1.2em} #ucm-q li{margin:.25em 0}
#ucm-q .src{font-size:14.5px;color:var(--ink2)}

@media (min-width:920px){
  #ucm-q .start{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}
  #ucm-q .work{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start}
  #ucm-q .scene{position:sticky;top:64px}
  #ucm-q .sum{grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
}
@media (max-width:560px){
  #ucm-q{font-size:16.5px}
  #ucm-q .logo span{display:none}
  #ucm-q .top{gap:6px;padding:6px 10px}
  #ucm-q .st-no{font-size:44px} #ucm-q .st-head h2{font-size:28px}
  #ucm-q .task{padding:14px} #ucm-q .q{font-size:18px}
  #ucm-q .main{padding:14px 10px 30px}
}
@media (max-width:420px){
  #ucm-q .chain{overflow:hidden}
  #ucm-q .chain button{min-width:15px;padding:5px 0}
  #ucm-q .chain svg{width:16px;height:16px}
  #ucm-q .chain button::before{top:13px}
  #ucm-q .readout{flex:none;gap:6px}
  #ucm-q .pts{font-size:17px}
  #ucm-q .lang button{padding:5px 5px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){ #ucm-q .ring{transition:none} }

<script>
(function(){
"use strict";
var TXT = {
de: {
 ui: {logo:'Die Welt des ganz Kleinen', pts:'P', start:'Zur ersten Station', next:'Weiter', back:'Zurück', toEnd:'Zur Auswertung', again:'Noch einmal von vorn',
   stationOf:function(i,n,m){ return 'Station '+i+' von '+n+' · etwa '+m+' Minuten'; }, task:'Frage', points:function(p){ return p+' Punkte'; },
   right:'Richtig', notYet:'Noch nicht', second:'Zweiter Versuch: 1 Punkt.', marks:{k:'bekannt',g:'gerechnet',m:'Lesart des Modells'}, markLabel:'Herkunft',
   pause:'Pause', go:'Weiter', reset:'Zurück auf null', again5:'Von vorn', more:'Genauer', live:'',
   send:'Elektronen', slit2:'Spalt 2 zu', curve:'Verteilung', clear:'Neu',
   spot:'Ort am Schirm', cage:'Käfig', atom:'Atom', grain:'Sandkorn', electronB:'Elektron', dlab:'Zähler 2', mass:'Masse', replay:'Noch einmal ansehen', elec2:'Elektronen', light:'Licht', zoom:'Uhren groß',
   turn:'Drehen', turnAgain:'Noch einmal', plus:'+ Elektron', minus:'− Elektron', nopauli:'Ohne Pauli',
   reroll:'Neu würfeln', zlab:'Abstand A–B', randchain:'Zufällige Kette', delchain:'Löschen',
   sumTitle:'Auswertung', sumOf:function(p,m){ return 'von '+m+' Punkten'; }, sumNote:'Station antippen, um sie noch einmal zu sehen.'},
 start: {eyebrow:'Das U-Zellen-Modell · Quantenphysik', h1a:'Die Welt des', h1b:'ganz Kleinen',
   lead:'Im Kleinen gelten andere Regeln. Teilchen breiten sich aus wie Wellen, nichts steht still, und zwei gleiche Teilchen teilen nie einen Platz. Zehn Stationen zeigen diese Regeln und, was die U-Zellen dazu sagen.',
   facts:['10 Stationen','22 Minuten','20 Punkte'], cardH:'So geht es', card:'Links ausprobieren, rechts eine Frage beantworten.', note:'',
   cap:'Elektronen kommen einzeln an. Erst viele zusammen zeigen die Streifen.'},
 st: [
 {title:'Zwei Spalte', sub:'Einzelne Elektronen, ein Streifenmuster', min:3, mark:'k',
  text:'<p>Elektronen fliegen einzeln durch zwei schmale Spalte. Jedes kommt als ein Punkt an. Viele zusammen bilden Streifen, wie sie nur Wellen machen.</p>',
  cap:'Wellenlänge riesig vergrößert. Verteilung gerechnet.',
  live:function(o){ return o.n+' Elektronen. '+(o.one ? 'Ein Spalt zu: <b class="n">keine Streifen</b>.' : 'Beide Spalte offen: <b class="n">Streifen</b>.'); },
  more:'<p>Die Verteilung am Schirm ist gerechnet: Von jeder Stelle der offenen Spalte geht eine Welle aus, und am Schirm werden alle zusammengezählt (Huygens). Jedes Elektron landet zufällig, aber mit dieser Verteilung. So hat es Akira Tonomura 1989 mit einzelnen Elektronen gefilmt.</p><p>Die Welle jedes einzelnen Elektrons geht durch beide Spalte zugleich. Schließt man einen, verschwinden die Streifen.</p>',
  q:{t:'Was passiert, wenn man einen Spalt schließt?', opts:[{t:'Die Streifen verschwinden', ok:1},{t:'Die Streifen werden schärfer', fb:'Probieren Sie „Spalt 2 zu“.'},{t:'Es kommen keine Elektronen mehr an', fb:'Durch den offenen Spalt kommen weiter Elektronen.'}], ok:'Jedes Elektron geht als Welle durch beide Spalte.'}},
 {title:'Zwei Wege, zwei Zeiger', sub:'Warum Streifen entstehen', min:3, mark:'k',
  text:'<p>Jeder Weg trägt einen Zeiger mit. Er dreht sich unterwegs, eine Runde je Wellenlänge. Am Ziel legt man die beiden Zeiger aneinander. Zeigen sie gleich: hell. Zeigen sie gegeneinander: dunkel.</p><p class="note">Den gelben Punkt am Schirm nach oben oder unten ziehen.</p>',
  cap:'Vereinfacht: nur ein Weg durch jeden Spalt. Wellenlänge riesig vergrößert.',
  live:function(o){ if (!o.arrived) return 'Die Zeiger sind unterwegs.'; return 'Unterschied '+o.d+' Runden: '+(o.kind === 'bright' ? '<b class="n">die Zeiger zeigen gleich, hell</b>.' : (o.kind === 'dark' ? '<b class="n">die Zeiger zeigen gegeneinander, dunkel</b>.' : 'teils, teils.')); },
  more:'<p>Unterscheiden sich die beiden Wege um eine ganze Zahl von Wellenlängen, zeigen die Zeiger am Ziel gleich, und der rote Pfeil ist doppelt so lang wie ein einzelner Zeiger. Um eine halbe Wellenlänge mehr, und sie heben sich auf. Wie viele Elektronen ankommen, gibt das Quadrat der Länge des roten Pfeils. So entstehen die Streifen; die graue Linie am Schirm zeigt sie für diese zwei Wege.</p>',
  q:{t:'Zwei Zeiger kommen an und zeigen genau gegeneinander. Was passiert?', opts:[{t:'Sie heben sich auf: dort ist es dunkel', ok:1},{t:'Sie verstärken sich: dort ist es hell', fb:'Gegeneinander heben sie sich auf. Hell ist es, wo sie gleich zeigen.'},{t:'Das Elektron kommt zweimal an', fb:'Es kommt nie zweimal an. Die Zeiger sagen nur, wie oft es wo ankommt.'}], ok:'So entstehen die dunklen Streifen.'}},
 {title:'Alle Wege zugleich', sub:'Feynmans Zeiger', min:3, mark:'k',
  text:'<p>Ein Spalt hat eine Breite, also gibt es durch jeden Spalt viele Wege. Feynmans Bild: Das Elektron nimmt sie alle zugleich. Am Ziel legt man alle Zeiger aneinander. Langer roter Pfeil: viele Elektronen. Kurzer: wenige.</p>',
  cap:'Hier breitere Spalte, Welle von links: zwölf Wege durch jeden Spalt. Wellenlänge riesig vergrößert.', building:'Die Zeiger der Wege werden einer nach dem anderen aneinandergelegt.',
  live:function(o){ return 'Hier kommen <b class="n">'+o.p+' %</b> so viele Elektronen an wie in der Mitte.'; },
  more:'<p>Jeder Zeiger dreht sich um eine Runde je Wellenlänge Weg. Am Ziel werden die Zeiger aneinandergelegt; das Quadrat der Länge des roten Pfeils gibt an, wie viele Elektronen dort ankommen. Mit den schmaleren Spalten aus Station 1 ergibt dieselbe Rechnung die Verteilung dort; die breiteren Spalte hier dämpfen die Streifen zum Rand hin.</p><p>Im glatten Raum gibt es unendlich viele Wege, und wie man sie alle zusammenzählt, ist mathematisch nicht sauber erklärt. Darauf kommen die Stationen 4 bis 6 zurück.</p>',
  q:{t:'Wo kommen keine Elektronen an?', opts:[{t:'Wo sich die Zeiger gegenseitig aufheben', ok:1},{t:'Wo die Wege am längsten sind', fb:'Es kommt nicht auf die Länge an, sondern darauf, wie die Zeiger zueinander stehen.'},{t:'Genau hinter der Wand zwischen den Spalten', fb:'Dort ist sogar ein heller Streifen: Beide Wege sind gleich lang, die Zeiger zeigen gleich.'}], ok:'Zeiger gegeneinander löschen sich aus. Das sind die dunklen Streifen.'}},
 {title:'Nichts steht still', sub:'Heisenbergs Regel', min:2, mark:'k',
  text:'<p>Je enger ein Teilchen eingesperrt ist, desto ungewisser ist sein Tempo. Ein Elektron im Atom kann deshalb nicht stillsitzen.</p>',
  cap:'Nicht maßstäblich. Zahlen gerechnet.',
  live:function(o){ return o.who+' im Käfig von '+o.dx+': Tempo ungewiss um mindestens <b class="n">'+o.dv+'</b>.'; },
  more:'<p>Heisenbergs Regel (1927): <span class="f">m · Δv · Δx ≥ ħ/2</span>, mit <span class="f">ħ = 1,05·10<sup>−34</sup> Js</span>. Für ein Elektron (<span class="f">9,1·10<sup>−31</sup> kg</span>) im Atom, <span class="f">Δx = 10<sup>−10</sup> m</span>, ergibt das fast 600 km/s. Bei einem Sandkorn von einem Milligramm bleibt die Ungewissheit winzig; darum merkt man im Alltag nichts davon.</p><p>Das liegt nicht an schlechten Messgeräten, sondern an der Natur.</p>',
  q:{t:'Was passiert, wenn man das Elektron enger einsperrt?', opts:[{t:'Sein Tempo wird ungewisser', ok:1},{t:'Es kommt zur Ruhe', fb:'Im Gegenteil: Je enger, desto unruhiger.'},{t:'Nichts', fb:'Schieben Sie den Käfig enger und sehen Sie auf die Zahl.'}], ok:'Genauer Ort und genaues Tempo zugleich gibt es nicht.'}},
 {title:'Zwei Umdrehungen', sub:'Ein Elektron ist ein Kreisel', min:2, mark:'k',
  text:'<p>Ein Elektron hat einen Spin. Dreht man es einmal ganz herum, sieht alles aus wie vorher, aber sein Zeiger steht umgekehrt. Erst nach zwei Umdrehungen ist alles wieder beim Alten.</p>',
  cap:'Links das Elektron, rechts sein Zeiger.',
  live:function(o){ return 'Gedreht um <b class="n">'+o.deg+'°</b>. Zeiger: '+o.state+'.'; },
  sameTxt:'wie am Anfang', oppTxt:'umgekehrt', midTxt:'unterwegs',
  more:'<p>Bei einer Drehung um den Winkel <span class="f">θ</span> dreht sich der Zeiger eines Elektrons nur um <span class="f">θ/2</span>. Nach 360° hat er das Vorzeichen gewechselt, nach 720° ist er zurück. Man kann es mit einem Teller auf der flachen Hand vorführen: Nach einer Umdrehung ist der Arm verdreht, nach einer zweiten in derselben Richtung wieder gerade.</p><p>Auf den Zellen ist ein solcher Kreisel auf einer Schnur gerechnet (Kapitel III.5 des Büchleins); im Raum mit drei Richtungen ist er offen.</p>',
  q:{t:'Wie oft muss man ein Elektron ganz herumdrehen, bis alles wieder wie am Anfang ist?', opts:[{t:'Zweimal', ok:1},{t:'Einmal', fb:'Nach einer Umdrehung steht der Zeiger umgekehrt.'},{t:'Nie', fb:'Nach zwei Umdrehungen ist alles wieder beim Alten.'}], ok:'Das gibt es nur im Kleinen.'}},
 {title:'Kein Platz für zwei', sub:'Paulis Gesetz', min:2, mark:'k',
  text:'<p>Aus Station 9 folgt: Zwei gleiche Elektronen sind nie im selben Zustand. Darum füllen sie ein Atom Schale um Schale. Ohne dieses Gesetz gäbe es keine Chemie.</p>',
  cap:'Pfeile: der Spin jedes Elektrons, oben oder unten.',
  live:function(o){ return o.name+': '+o.n+' Elektronen, '+o.shells+'.'+(o.off?' <b class="n">Ohne Pauli säßen alle innen.</b>':''); },
  els:['','Wasserstoff','Helium','Lithium','Beryllium','Bor','Kohlenstoff','Stickstoff','Sauerstoff','Fluor','Neon','Natrium'],
  more:'<p>Wolfgang Pauli, 1925. In der innersten Schale gibt es einen Zustand, der zwei Elektronen aufnimmt, eines mit Spin nach oben und eines nach unten. In der zweiten gibt es vier, also Platz für acht. Natrium hat elf Elektronen: 2 + 8 + 1. Das eine äußere bestimmt, wie Natrium sich verbindet.</p><p>Das Gesetz folgt aus dem Minus von Station 9: Vertauscht man zwei gleiche Elektronen, wechselt das Vorzeichen. Wären beide im selben Zustand, müsste der Zustand null sein. Auf den Zellen ist nachgerechnet, dass diese Regel auf einer Schnur ohne Widerspruch möglich ist; warum sie gelten muss, ist nicht gezeigt.</p>',
  q:{t:'Wie viele Elektronen passen in die innerste Schale?', opts:[{t:'Zwei', ok:1},{t:'Eins', fb:'Zwei: eines mit Spin nach oben, eines nach unten.'},{t:'Beliebig viele', fb:'Nur ohne Paulis Gesetz. Probieren Sie „Ohne Pauli“.'}], ok:'Eines mit Spin nach oben, eines nach unten.'}},
 {title:'Wege aus Zellen', sub:'Ketten von A nach B', min:3, mark:'k',
  text:'<p>Feynman zählt alle Wege zusammen. Im glatten Raum sind das unendlich viele. Auf den U-Zellen sind es nur endlich viele: Ein Weg ist eine Kette von Zelle zu Zelle.</p><p>Das Bild zeigt Ort und Zeit: waagrecht der Ort, nach oben die Zeit. A ist der Start, B das Ziel. Weiter geht es nur schräg nach oben (gelb), denn nichts ist schneller als das Licht. Jede Zelle, an der die Kette unterwegs hält, ist ein <b>Halt</b>.</p><p class="note">Selbst herausfinden: ① Zellen antippen und eine Kette bauen. ② Unten eine Zahl antippen: Alle Ketten mit so vielen Halten laufen durch und werden gezählt.</p>',
  cap:'Zeit nach oben. Gelb: wohin die Kette weitergehen darf.',
  live:function(o){ if (!o.built) return '<b class="n">① Tippen Sie eine Zelle an.</b> Weiter geht es nur in den gelben Bereich.'; return 'Ihre Kette hat <b class="n">'+o.n+(o.n === 1 ? ' Halt' : ' Halte')+'</b>.'+(o.counted ? '' : ' <b class="n">② Jetzt unten eine Zahl antippen.</b>'); },
  counting:function(o){ return o.done ? 'Gezählt: <b class="n">'+o.all+(o.all === 1 ? ' Kette' : ' Ketten')+' mit '+o.n+(o.n === 1 ? ' Halt' : ' Halten')+'</b>. Probieren Sie eine andere Zahl.' : 'Alle Ketten mit <b class="n">'+o.n+(o.n === 1 ? ' Halt' : ' Halten')+'</b>, eine nach der anderen: '+o.k+' von '+o.all+'.'; },
  more:'<p>So kommen die Zahlen zustande: Mit 0 Halten gibt es eine Kette, den direkten Sprung. Mit 1 Halt gibt es so viele Ketten, wie Zellen zwischen A und B liegen, denn jede Zelle liegt nach A und vor B. Mit 2 Halten zählt man alle Paare von Zellen, bei denen die zweite im gelben Bereich der ersten liegt, und so fort. Die Zahlen gelten für diesen einen Wurf der Zellen; „Neu würfeln“ ergibt andere.</p><p>Im Mittel über viele Würfe gibt es <span class="f">(ρV)<sup>n</sup>/(n!)<sup>2</sup></span> Ketten mit <span class="f">n</span> Halten, mit der Dichte <span class="f">ρ</span> der Zellen und der Größe <span class="f">V</span> der Raute. Gezeichnet ist eine Schnur: eine Raumrichtung und die Zeit. Die Regel der Ketten stammt von Steven Johnston (2008).</p>',
  q:{t:'Zwischen A und B liegen 22 Zellen. Wie viele Ketten mit einem Halt gibt es?', opts:[{t:'22, eine für jede Zelle', ok:1},{t:'1', fb:'Eine Kette ohne Halt gibt es einmal. Mit einem Halt kann jede der 22 Zellen der Halt sein.'},{t:'2', fb:'Jede der 22 Zellen kann der Halt sein.'}], ok:'Jede Zelle zwischen A und B ist ein möglicher Halt.'}},
 {title:'Plus oder Minus', sub:'Woher das Vorzeichen kommt', min:2, mark:'k',
  text:'<p>Jede Kette bekommt eine Zahl, ihr Gewicht. Jeder Sprung bringt den Faktor ½ mit. Jeder Halt bringt einen kleinen Faktor mit, und der ist negativ: −b. Er kommt von der Masse des Teilchens.</p><p>Minus mal Minus ist Plus. Darum zählt eine Kette mit gerader Zahl von Halten positiv, mit ungerader negativ.</p>',
  cap:'Blau: ein Sprung, Faktor ½. Rot: ein Halt, Faktor −b.',
  live:function(o){ return o.n+(o.n === 1 ? ' Halt' : ' Halte')+': '+o.n+' Minuszeichen, das Gewicht ist <b class="n">'+(o.minus ? 'negativ' : 'positiv')+'</b>.'; },
  more:'<p>Johnstons Regel auf der Schnur: Ein Teilchen ohne Masse breitet sich innerhalb seines Lichtkegels überall gleich stark aus, mit dem Wert ½; das ist der Faktor je Sprung. Die Masse kommt über die Halte herein, mit dem Faktor <span class="f">−m²/ρ</span> je Halt (Masse zum Quadrat durch die Dichte der Zellen, in Einheiten mit <span class="f">c = ħ = 1</span>).</p><p>Warum negativ? Im glatten Raum gilt dieselbe Zerlegung: Die Ausbreitung eines Teilchens mit Masse ist die eines Teilchens ohne Masse, minus eine Korrektur mit einer Stelle, an der die Masse wirkt, plus eine mit zwei Stellen, und so fort. Die Ketten setzen diese Reihe auf die Zellen.</p>',
  q:{t:'Woher kommt das Minus bei manchen Ketten?', opts:[{t:'Jeder Halt bringt einen negativen Faktor mit', ok:1},{t:'Lange Ketten zählen immer negativ', fb:'Es kommt auf die Zahl der Halte an, nicht auf die Länge: gerade Zahl Plus, ungerade Minus.'},{t:'Es wird ausgewürfelt', fb:'Ausgewürfelt wird nur, wo die Zellen liegen. Das Vorzeichen folgt aus der Zahl der Halte.'}], ok:'Minus mal Minus ist Plus: gerade Zahl von Halten positiv, ungerade negativ.'}},
 {title:'Viel dafür, viel dagegen', sub:'Feynmans Summe auf den U-Zellen', min:3, mark:'g',
  text:'<p>In Station 5 bekam eine Kette ihr Gewicht. Jetzt werden alle Ketten von A nach B zusammengezählt, sortiert nach der Zahl der Halte und gemittelt über viele Würfe. Ohne Vorzeichen ist das viel. Mit Vorzeichen hebt sich fast alles auf.</p><p>Der Graph der Summe zeigt, was übrig bleibt, je Abstand: eine Welle.</p><p class="note">Abstand von A nach B verschieben.</p>',
  cap:'Oben: eine Kette, grün Plus, rot Minus. Mitte: Beitrag je Zahl der Halte (antippen). Unten: Graph der Summe.',
  live:function(o){ return 'Abstand '+o.z+': ohne Vorzeichen <b class="n">'+o.abs+'</b>, Summe mit Vorzeichen <b class="n">'+o.sum+'</b>.'; },
  more:'<p>Die Regel stammt von Steven Johnston (2008). Gemittelt über viele Würfe der Zellen tragen die Ketten mit <span class="f">n</span> Halten <span class="f">(−1)<sup>n</sup> z<sup>2n</sup> / (2·(n!)<sup>2</sup>)</span> bei; <span class="f">z</span> ist der Abstand von A nach B in einer Einheit, die von der Masse abhängt. Das Bild zeigt die Beiträge ohne den Faktor ½; die Tabelle zeigt die Halte 0 bis 6, die Summe nimmt alle. Zusammen mit Vorzeichen ist das eine Welle, und wenn viel Zeit vergeht, genau Feynmans Welle.</p><p><b>Gerechnet:</b> Im Mittel stimmt die Summe auf den Zellen bei jeder Dichte genau, auch wenn zwischen A und B im Mittel nur eine halbe Zelle liegt (Beweis mit einer Formel von Mecke). Ein einzelner Wurf rauscht, und das Rauschen wächst mit der Zeit. All das gilt auf einer Schnur, mit einer Raumrichtung. Im Raum stimmt die Summe nur bei sehr dichten Zellen.</p>',
  q:{t:'Alle Beiträge zusammen sind groß. Was bleibt mit Vorzeichen übrig?', opts:[{t:'Wenig: Plus und Minus heben sich fast auf', ok:1},{t:'Noch mehr', fb:'Mit Vorzeichen wird es weniger, nicht mehr. Vergleichen Sie die beiden Zahlen.'},{t:'Genau null', fb:'Nicht ganz: Der Rest ist eine Welle.'}], ok:'Aus dem Rest wird im Mittel Feynmans Welle.'}},
 {title:'Zwei gleiche Elektronen', sub:'Tauschen gibt Minus', min:3, mark:'k',
  text:'<p>Zwei Elektronen, zwei Zähler. Beide Zähler klicken. Welches Elektron kam wo an? Gerade oder über Kreuz? Das ist nicht zu sagen, denn gleiche Elektronen sehen völlig gleich aus. Also zählen beide Möglichkeiten, jede mit ihrem Zeiger, wie die Wege in Station 2.</p><p>Über Kreuz haben die beiden getauscht. Ein Tausch wirkt wie eine volle Umdrehung: Der Zeiger kehrt sich um, wie in Station 8. Darum wird er abgezogen.</p><p class="note">Zähler 2 zu Zähler 1 ziehen.</p>',
  cap:'Vereinfacht: beide Elektronen mit gleichem Spin. Wellenlänge riesig vergrößert.',
  steps:['Möglichkeit 1: gerade','Möglichkeit 2: über Kreuz','Tauschen gibt Minus','Zusammenlegen'],
  stepsL:['Möglichkeit 1: gerade','Möglichkeit 2: über Kreuz','Licht: kein Minus','Zusammenlegen'],
  stepLive:['Beide Elektronen fliegen gerade. Jedes bringt seinen Zeiger mit; zusammen ergeben sie <b class="n">Zeiger 1</b>.','Oder sie fliegen über Kreuz: Wieder klicken Zähler 1 und 2. Das ergibt <b class="n">Zeiger 2</b>.','Über Kreuz haben die beiden getauscht. Der Tausch verdreht das Band zwischen ihnen einmal ganz. Glätten heißt: ein Elektron einmal ganz drehen. Dabei <b class="n">kehrt sich sein Zeiger um</b> (Station 8).','',
    'Beide Lichtteilchen fliegen gerade. Jedes bringt seinen Zeiger mit; zusammen ergeben sie <b class="n">Zeiger 1</b>.','Oder sie fliegen über Kreuz. Das ergibt <b class="n">Zeiger 2</b>.','Auch hier verdreht der Tausch das Band einmal ganz. Bei Lichtteilchen kehrt eine volle Umdrehung den Zeiger aber nicht um: <b class="n">kein Minus</b>.',''],
  words:['nie','selten','manchmal','oft'],
  live:function(o){ if (o.same) return o.ferm ? '<b class="n">Beide Zähler am selben Ort:</b> Die Zeiger heben sich genau auf. Zwei gleiche Elektronen kommen nie zugleich am selben Ort an.' : '<b class="n">Beide Zähler am selben Ort:</b> Die Zeiger addieren sich. Lichtteilchen kommen hier gern zu zweit an.'; return 'Beide Zähler klicken zugleich: <b class="n">'+o.word+'</b>.'; },
  more:'<p><b>Ein Zeiger je Möglichkeit.</b> Jede Möglichkeit besteht aus zwei Wegen, einem für jedes Elektron. Ihr Zeiger dreht sich so viele Runden, wie beide Wege zusammen ergeben; mathematisch werden die beiden Zeiger multipliziert.</p><p><b>Plus oder Minus.</b> Bei Licht werden die Zeiger der beiden Möglichkeiten addiert, bei Elektronen wird „über Kreuz“ abgezogen. Wie oft beide Zähler zugleich klicken, gibt das Quadrat der Länge des roten Pfeils.</p><p><b>Am selben Ort.</b> Stehen beide Zähler an derselben Stelle, sind „gerade“ und „über Kreuz“ dieselbe Möglichkeit, mit demselben Zeiger. Gleiches minus Gleiches ist null: Zwei Elektronen mit gleichem Spin kommen nie zugleich am selben Ort an. Allgemein gilt: Zwei gleiche Elektronen sind nie im selben Zustand. Das ist Paulis Gesetz (1925). Mit entgegengesetztem Spin sind sie nicht im selben Zustand und dürfen an denselben Platz. Darum füllen Elektronen ein Atom Schale um Schale, je zwei pro Platz; ohne dieses Gesetz gäbe es keine Chemie.</p><p><b>Woher das Minus kommt.</b> Aus den Wegen allein folgt es nicht. Pauli hat 1940 bewiesen: Teilchen mit halbem Spin wie das Elektron tauschen mit Minus, Teilchen mit ganzem Spin wie das Lichtteilchen mit Plus. Anschaulich ist ein Tausch der beiden wie eine volle Umdrehung, und die gibt beim Elektron ein Minus (Station 8). Feynman hat das mit einem Gürtel vorgeführt: Vertauscht man zwei Gegenstände, die durch einen Gürtel verbunden sind, ist der Gürtel danach um eine volle Umdrehung verdreht.</p><p><b>Auf den U-Zellen</b> ist nachgerechnet, dass das Minus beim Tausch auf einer Schnur ohne Widerspruch möglich ist. Warum es gelten muss, ist dort nicht gezeigt.</p>',
  q:{t:'Beide Zähler stehen am selben Ort. Wie oft kommen zwei gleiche Elektronen dort zugleich an?', opts:[{t:'Nie', ok:1},{t:'Doppelt so oft', fb:'Das gilt für Licht. Bei Elektronen wird abgezogen.'},{t:'Wie sonst auch', fb:'Die beiden Zeiger heben sich dort genau auf.'}], ok:'Gerade minus über Kreuz ergibt dort null.'}},
 {title:'Nur ein Weg', sub:'Warum ein Stein seine Bahn fliegt', min:3, mark:'k',
  text:'<p>Auch ein geworfener Stein nimmt alle Wege von A nach B, jeder mit seinem Zeiger. Je schwerer der Körper, desto schneller dreht sich der Zeiger, sobald ein Weg von der gewöhnlichen Bahn abweicht.</p><p>Dann heben sich die Zeiger fast aller Wege gegenseitig weg. Übrig bleiben nur die Wege nahe der Bahn (gelb). So wird aus Feynmans Summe die Wurfbahn.</p><p>Darum wird es immer wahrscheinlicher, den Körper nahe der Bahn zu finden (grün), je schwerer er ist.</p><p class="note">Masse nach rechts schieben.</p>',
  cap:'Nicht maßstäblich. Bei einem echten Stein ist das gelbe Band unvorstellbar schmal.',
  live:function(o){ return (o.all ? 'Leicht: alle '+o.n+' Wege zählen mit.' : 'Es zählen '+o.k+' von '+o.n+' gezeichneten Wegen.')+' Auf halbem Weg ist der Körper mit <b class="n">'+o.p+' %</b> im Streifen um die Bahn.'; },
  more:'<p>Der Zeiger eines Weges dreht sich um dessen Wirkung, geteilt durch <span class="f">ħ</span> (Feynman, Hibbs 1965). Für die gezeichneten Wege, die um die Höhe <span class="f">a</span> von der Bahn abweichen, wächst die Wirkung im gleichmäßigen Schwerefeld genau um <span class="f">m·π²·a²/(4T)</span>; <span class="f">T</span> ist die Flugzeit. Für einen Stein von 1 g, eine Sekunde Flug und <span class="f">a</span> = 1 mm sind das etwa 4·10<sup>24</sup> Runden. Nur an der Bahn selbst ändert sich der Zeiger nicht, wenn man den Weg ein wenig verbiegt; dort bleibt die Summe stehen. Das ist das Prinzip der kleinsten Wirkung, genauer: der stationären Wirkung.</p><p>Gelb sind die Wege, deren Zeiger höchstens eine Viertelrunde gegen den Zeiger der Bahn gedreht ist. Grün ist, wo man den Körper auf halbem Weg findet, wenn man ihn so gezielt losschickt, wie Heisenbergs Regel es erlaubt (Station 7): eine Glocke der Breite <span class="f">σ = √(ħT/(2m))</span>. Die Prozentzahl ist die Wahrscheinlichkeit, ihn dann im gestrichelten Streifen zu finden. Wie sich die Bahn im Schwerefeld krümmt, zeigt die Seite „Warum die Dinge fallen“.</p>',
  q:{t:'Warum fliegt ein schwerer Stein nur auf seiner Bahn?', opts:[{t:'Die Zeiger der anderen Wege heben sich weg', ok:1},{t:'Andere Wege sind verboten', fb:'Erlaubt sind alle Wege. Ihre Zeiger heben sich aber gegenseitig weg.'},{t:'Ein Stein hat keine Zeiger', fb:'Auch der Stein hat Zeiger. Sie drehen sich nur rasend schnell.'}], ok:'Übrig bleiben nur die Wege nahe der Bahn.'}}
 ],
 end: {sumH:'Worauf es ankommt',
   sum:'Teilchen breiten sich als Wellen aus und nehmen alle Wege zugleich. Nichts kann stillstehen. Ein Elektron braucht zwei Umdrehungen; weil Tauschen ein Minus gibt, teilen zwei gleiche nie einen Platz. Ein schwerer Körper nimmt nur den Weg, den die Summe übrig lässt: seine Bahn. Auf den U-Zellen wird aus Plus und Minus Feynmans Welle.',
   newH:'Was daran neu ist und was nicht',
   neu:'<p>Doppelspalt, Feynmans Wege, Heisenbergs Regel, Spin, das Minus beim Tausch und Paulis Gesetz sind Lehrbuch, ebenso, wie aus Feynmans Summe die Bahn eines Steins wird. Die Summe über Ketten von Zellen stammt von Steven Johnston. Eigen ist der Beweis, dass sie im Mittel bei jeder Dichte genau stimmt, und die Rechnung, wie stark ein einzelner Wurf rauscht.</p>',
   openH:'Was offen bleibt',
   open:'Gerechnet ist das auf den Zellen vor allem auf einer Schnur, mit einer Raumrichtung. Im Raum stimmt die Summe nur bei sehr dichten Zellen, und warum das Minus beim Tausch gelten muss, ist nicht gezeigt.',
   srcH:'Belege',
   src:'<ul><li>A. Tonomura u. a.: Demonstration of single-electron buildup of an interference pattern. Am. J. Phys. 57, 117 (1989).</li><li>R. P. Feynman, A. R. Hibbs: Quantum Mechanics and Path Integrals. McGraw-Hill 1965.</li><li>W. Heisenberg: Über den anschaulichen Inhalt der quantentheoretischen Kinematik und Mechanik. Z. Phys. 43, 172 (1927).</li><li>W. Pauli: Über den Zusammenhang des Abschlusses der Elektronengruppen im Atom mit der Komplexstruktur der Spektren. Z. Phys. 31, 765 (1925).</li><li>W. Pauli: The connection between spin and statistics. Phys. Rev. 58, 716 (1940).</li><li>R. P. Feynman, R. B. Leighton, M. Sands: The Feynman Lectures on Physics, Band III, Kapitel 4. Addison-Wesley 1965.</li><li>S. Johnston: Particle propagators on discrete spacetime. Class. Quantum Grav. 25, 202001 (2008).</li><li>Mehr: Kapitel II.1, III.5, III.6 und V.5 im Büchlein „The Universe in a Dot, Zweite Fassung“.</li></ul>'}
},

 ui: {logo:'The world of the very small', pts:'P', start:'To the first station', next:'Next', back:'Back', toEnd:'To the results', again:'Start over',

 start: {eyebrow:'The U-cell model · Quantum physics', h1a:'The world of', h1b:'the very small',
   lead:'In the small, other rules hold. Particles spread like waves, nothing stands still, and two identical particles never share a place. Ten stations show these rules and what the U-cells say about them.',
   facts:['10 stations','22 minutes','20 points'], cardH:'How it works', card:'Try things on the left, answer a question on the right.', note:'',
   cap:'Electrons arrive one by one. Only many together show the stripes.'},
 st: [
 {title:'Two slits', sub:'Single electrons, a pattern of stripes', min:3, mark:'k',
  text:'<p>Electrons fly one at a time through two narrow slits. Each arrives as a single dot. Many together form stripes, as only waves make them.</p>',
  cap:'Wavelength hugely enlarged. Distribution computed.',
  live:function(o){ return o.n+' electrons. '+(o.one ? 'One slit closed: <b class="n">no stripes</b>.' : 'Both slits open: <b class="n">stripes</b>.'); },
  more:'<p>The distribution on the screen is computed: from every point of the open slits a wave goes out, and at the screen all of them are added (Huygens). Each electron lands at random, but with this distribution. Akira Tonomura filmed exactly this with single electrons in 1989.</p><p>The wave of every single electron goes through both slits at once. Close one, and the stripes disappear.</p>',
  q:{t:'What happens when one slit is closed?', opts:[{t:'The stripes disappear', ok:1},{t:'The stripes become sharper', fb:'Try “Close slit 2”.'},{t:'No electrons arrive any more', fb:'Electrons still come through the open slit.'}], ok:'Every electron goes through both slits as a wave.'}},
 {title:'Two paths, two pointers', sub:'Why stripes arise', min:3, mark:'k',
  text:'<p>Each path carries a pointer. It turns along the way, one round per wavelength. At the target the two pointers are laid head to tail. Pointing alike: bright. Pointing against each other: dark.</p><p class="note">Drag the yellow point on the screen up or down.</p>',
  cap:'Simplified: only one path through each slit. Wavelength hugely enlarged.',
  live:function(o){ if (!o.arrived) return 'The pointers are on their way.'; return 'Difference '+o.d+' rounds: '+(o.kind === 'bright' ? '<b class="n">the pointers point alike, bright</b>.' : (o.kind === 'dark' ? '<b class="n">the pointers point against each other, dark</b>.' : 'partly, partly.')); },
  more:'<p>If the two paths differ by a whole number of wavelengths, the pointers point alike at the target, and the red arrow is twice as long as a single pointer. Half a wavelength more, and they cancel. How many electrons arrive is given by the square of the length of the red arrow. That is how the stripes arise; the grey line at the screen shows them for these two paths.</p>',
  q:{t:'Two pointers arrive pointing exactly against each other. What happens?', opts:[{t:'They cancel: it is dark there', ok:1},{t:'They reinforce: it is bright there', fb:'Against each other they cancel. It is bright where they point alike.'},{t:'The electron arrives twice', fb:'It never arrives twice. The pointers only tell how often it arrives where.'}], ok:'That is how the dark stripes arise.'}},
 {title:'All paths at once', sub:'Feynman\'s pointers', min:3, mark:'k',
  text:'<p>A slit has a width, so there are many paths through each slit. Feynman\'s picture: the electron takes them all at once. At the end all pointers are laid head to tail. Long red arrow: many electrons. Short: few.</p>',
  cap:'Wider slits here, wave from the left: twelve paths through each slit. Wavelength hugely enlarged.', building:'The pointers of the paths are laid head to tail, one after another.',
  live:function(o){ return 'Here <b class="n">'+o.p+' %</b> as many electrons arrive as in the middle.'; },
  more:'<p>Every pointer turns by one round per wavelength of path. At the end the pointers are laid head to tail; the square of the length of the red arrow tells how many electrons arrive there. With the narrower slits of station 1 the same calculation gives the distribution there; the wider slits here weaken the stripes toward the edge.</p><p>In smooth space there are infinitely many paths, and how to add them all up is not cleanly defined mathematically. Stations 4 to 6 come back to this.</p>',
  q:{t:'Where do no electrons arrive?', opts:[{t:'Where the pointers cancel each other', ok:1},{t:'Where the paths are longest', fb:'It is not the length that matters but how the pointers stand to one another.'},{t:'Right behind the wall between the slits', fb:'There is even a bright stripe there: both paths are equally long, the pointers point alike.'}], ok:'Pointers pointing against each other cancel. These are the dark stripes.'}},
 {title:'Nothing stands still', sub:'Heisenberg\'s rule', min:2, mark:'k',
  text:'<p>The more tightly a particle is locked in, the more uncertain its speed. So an electron in an atom cannot sit still.</p>',
  cap:'Not to scale. Numbers computed.',
  live:function(o){ return o.who+' in a cage of '+o.dx+': speed uncertain by at least <b class="n">'+o.dv+'</b>.'; },
  more:'<p>Heisenberg\'s rule (1927): <span class="f">m · Δv · Δx ≥ ħ/2</span>, with <span class="f">ħ = 1.05·10<sup>−34</sup> Js</span>. For an electron (<span class="f">9.1·10<sup>−31</sup> kg</span>) in an atom, <span class="f">Δx = 10<sup>−10</sup> m</span>, this gives almost 600 km/s. For a grain of sand of one milligram the uncertainty stays tiny; that is why we notice nothing of it in everyday life.</p><p>This is not due to poor instruments but to nature.</p>',
  q:{t:'What happens when the electron is locked in more tightly?', opts:[{t:'Its speed becomes more uncertain', ok:1},{t:'It comes to rest', fb:'On the contrary: the tighter, the more restless.'},{t:'Nothing', fb:'Make the cage tighter and look at the number.'}], ok:'An exact place and an exact speed at once do not exist.'}},
 {title:'Two turns', sub:'An electron is a spinning top', min:2, mark:'k',
  text:'<p>An electron has a spin. Turn it once all the way round, and everything looks as before, but its pointer is reversed. Only after two turns is everything back as it was.</p>',
  cap:'Left the electron, right its pointer.',
  live:function(o){ return 'Turned by <b class="n">'+o.deg+'°</b>. Pointer: '+o.state+'.'; },
  sameTxt:'as at the start', oppTxt:'reversed', midTxt:'on the way',
  more:'<p>When turned by the angle <span class="f">θ</span>, the pointer of an electron turns only by <span class="f">θ/2</span>. After 360° it has changed sign, after 720° it is back. One can show it with a plate on the flat hand: after one turn the arm is twisted, after a second in the same direction it is straight again.</p><p>On the cells such a top is computed on a cord (chapter III.5 of the booklet); in space with three directions it is open.</p>',
  q:{t:'How often must an electron be turned all the way round until everything is as at the start?', opts:[{t:'Twice', ok:1},{t:'Once', fb:'After one turn the pointer is reversed.'},{t:'Never', fb:'After two turns everything is back as it was.'}], ok:'That exists only in the small.'}},
 {title:'No room for two', sub:'Pauli\'s law', min:2, mark:'k',
  text:'<p>From station 9 it follows: two identical electrons are never in the same state. So they fill an atom shell by shell. Without this law there would be no chemistry.</p>',
  cap:'Arrows: the spin of each electron, up or down.',
  live:function(o){ return o.name+': '+o.n+' electrons, '+o.shells+'.'+(o.off?' <b class="n">Without Pauli all would sit inside.</b>':''); },
  els:['','Hydrogen','Helium','Lithium','Beryllium','Boron','Carbon','Nitrogen','Oxygen','Fluorine','Neon','Sodium'],
  more:'<p>Wolfgang Pauli, 1925. In the innermost shell there is one state, which takes two electrons, one with spin up and one with spin down. In the second there are four, so room for eight. Sodium has eleven electrons: 2 + 8 + 1. The one outside decides how sodium bonds.</p><p>The law follows from the minus of station 9: swap two identical electrons, and the sign changes. If both were in the same state, the state would have to be zero. On the cells it is computed that this rule is possible without contradiction on a cord; why it must hold is not shown.</p>',
  q:{t:'How many electrons fit into the innermost shell?', opts:[{t:'Two', ok:1},{t:'One', fb:'Two: one with spin up, one with spin down.'},{t:'Any number', fb:'Only without Pauli\'s law. Try “Without Pauli”.'}], ok:'One with spin up, one with spin down.'}},
 {title:'Paths made of cells', sub:'Chains from A to B', min:3, mark:'k',
  text:'<p>Feynman adds up all paths. In smooth space there are infinitely many. On the U-cells there are only finitely many: a path is a chain from cell to cell.</p><p>The picture shows place and time: place sideways, time upward. A is the start, B the target. The chain can only go on slanting upward (yellow), because nothing is faster than light. Every cell where the chain stops on the way is a <b>stop</b>.</p><p class="note">Find out yourself: ① tap cells and build a chain. ② Tap a number below: all chains with that many stops run through and are counted.</p>',
  cap:'Time runs upward. Yellow: where the chain may go on.',
  live:function(o){ if (!o.built) return '<b class="n">① Tap a cell.</b> The chain can only go on into the yellow region.'; return 'Your chain has <b class="n">'+o.n+(o.n === 1 ? ' stop' : ' stops')+'</b>.'+(o.counted ? '' : ' <b class="n">② Now tap a number below.</b>'); },
  counting:function(o){ return o.done ? 'Counted: <b class="n">'+o.all+(o.all === 1 ? ' chain' : ' chains')+' with '+o.n+(o.n === 1 ? ' stop' : ' stops')+'</b>. Try another number.' : 'All chains with <b class="n">'+o.n+(o.n === 1 ? ' stop' : ' stops')+'</b>, one after another: '+o.k+' of '+o.all+'.'; },
  more:'<p>This is how the numbers come about: with 0 stops there is one chain, the direct jump. With 1 stop there are as many chains as cells between A and B, because every cell lies after A and before B. With 2 stops one counts all pairs of cells where the second lies in the yellow region of the first, and so on. The numbers hold for this one throw of the cells; “Roll again” gives others.</p><p>On average over many throws there are <span class="f">(ρV)<sup>n</sup>/(n!)<sup>2</sup></span> chains with <span class="f">n</span> stops, with the density <span class="f">ρ</span> of the cells and the size <span class="f">V</span> of the diamond. Drawn is a cord: one direction of space and time. The rule of the chains comes from Steven Johnston (2008).</p>',
  q:{t:'22 cells lie between A and B. How many chains with one stop are there?', opts:[{t:'22, one for each cell', ok:1},{t:'1', fb:'A chain without a stop exists once. With one stop, each of the 22 cells can be the stop.'},{t:'2', fb:'Each of the 22 cells can be the stop.'}], ok:'Every cell between A and B is a possible stop.'}},
 {title:'Plus or minus', sub:'Where the sign comes from', min:2, mark:'k',
  text:'<p>Every chain gets a number, its weight. Every jump brings the factor ½. Every stop brings a small factor, and it is negative: −b. It comes from the mass of the particle.</p><p>Minus times minus is plus. So a chain with an even number of stops counts positive, with an odd number negative.</p>',
  cap:'Blue: a jump, factor ½. Red: a stop, factor −b.',
  live:function(o){ return o.n+(o.n === 1 ? ' stop' : ' stops')+': '+o.n+' minus signs, the weight is <b class="n">'+(o.minus ? 'negative' : 'positive')+'</b>.'; },
  more:'<p>Johnston\'s rule on the cord: a particle without mass spreads equally strongly everywhere inside its light cone, with the value ½; that is the factor per jump. The mass enters through the stops, with the factor <span class="f">−m²/ρ</span> per stop (mass squared over the density of the cells, in units with <span class="f">c = ħ = 1</span>).</p><p>Why negative? In smooth space the same decomposition holds: the propagation of a particle with mass is that of a particle without mass, minus a correction with one place where the mass acts, plus one with two places, and so on. The chains put this series onto the cells.</p>',
  q:{t:'Where does the minus of some chains come from?', opts:[{t:'Every stop brings a negative factor', ok:1},{t:'Long chains always count negative', fb:'It depends on the number of stops, not the length: even plus, odd minus.'},{t:'It is decided by chance', fb:'Only where the cells lie is decided by chance. The sign follows from the number of stops.'}], ok:'Minus times minus is plus: even number of stops positive, odd negative.'}},
 {title:'Much for, much against', sub:'Feynman\'s sum on the U-cells', min:3, mark:'g',
  text:'<p>In station 5 one chain got its weight. Now all chains from A to B are added up, sorted by the number of stops and averaged over many throws. Without signs that is a lot. With signs almost everything cancels.</p><p>The graph of the sum shows what is left, per distance: a wave.</p><p class="note">Move the distance from A to B.</p>',
  cap:'Top: one chain, green plus, red minus. Middle: share per number of stops (tap). Bottom: graph of the sum.',
  live:function(o){ return 'Distance '+o.z+': without signs <b class="n">'+o.abs+'</b>, sum with signs <b class="n">'+o.sum+'</b>.'; },
  more:'<p>The rule comes from Steven Johnston (2008). Averaged over many throws of the cells, the chains with <span class="f">n</span> stops contribute <span class="f">(−1)<sup>n</sup> z<sup>2n</sup> / (2·(n!)<sup>2</sup>)</span>; <span class="f">z</span> is the distance from A to B in a unit that depends on the mass. The picture shows the contributions without the factor ½; the table shows 0 to 6 stops, the sum takes all of them. Together with signs this is a wave, and when much time passes, exactly Feynman\'s wave.</p><p><b>Computed:</b> On average the sum on the cells is exact at every density, even when on average only half a cell lies between A and B (proof with a formula by Mecke). A single throw is noisy, and the noise grows with time. All this holds on a cord, with one direction of space. In space the sum is right only for very dense cells.</p>',
  q:{t:'All contributions together are large. What is left with signs?', opts:[{t:'Little: plus and minus almost cancel', ok:1},{t:'Even more', fb:'With signs it becomes less, not more. Compare the two numbers.'},{t:'Exactly zero', fb:'Not quite: the remainder is a wave.'}], ok:'On average the remainder becomes Feynman\'s wave.'}},
 {title:'Two identical electrons', sub:'Swapping gives minus', min:3, mark:'k',
  text:'<p>Two electrons, two counters. Both counters click. Which electron arrived where? Straight or crossed? There is no telling, because identical electrons look exactly alike. So both possibilities count, each with its pointer, like the paths in station 2.</p><p>Crossed, the two have swapped. A swap acts like a full turn: the pointer reverses, as in station 8. That is why it is subtracted.</p><p class="note">Drag counter 2 to counter 1.</p>',
  cap:'Simplified: both electrons with the same spin. Wavelength hugely enlarged.',
  steps:['Possibility 1: straight','Possibility 2: crossed','Swapping gives minus','Putting together'],
  stepsL:['Possibility 1: straight','Possibility 2: crossed','Light: no minus','Putting together'],
  stepLive:['Both electrons fly straight. Each brings its pointer; together they give <b class="n">pointer 1</b>.','Or they fly crossed: again counters 1 and 2 click. That gives <b class="n">pointer 2</b>.','Crossed, the two have swapped. The swap twists the band between them by one full turn. Smoothing it means turning one electron fully. Its <b class="n">pointer reverses</b> (station 8).','',
    'Both light particles fly straight. Each brings its pointer; together they give <b class="n">pointer 1</b>.','Or they fly crossed. That gives <b class="n">pointer 2</b>.','Here too the swap twists the band by one full turn. But for light particles a full turn does not reverse the pointer: <b class="n">no minus</b>.',''],
  words:['never','rarely','sometimes','often'],
  live:function(o){ if (o.same) return o.ferm ? '<b class="n">Both counters at the same place:</b> the pointers cancel exactly. Two identical electrons never arrive at the same place at once.' : '<b class="n">Both counters at the same place:</b> the pointers add. Light particles like to arrive in pairs here.'; return 'Both counters click at once: <b class="n">'+o.word+'</b>.'; },
  more:'<p><b>One pointer per possibility.</b> Each possibility consists of two paths, one for each electron. Its pointer turns as many rounds as both paths give together; mathematically the two pointers are multiplied.</p><p><b>Plus or minus.</b> For light the pointers of the two possibilities are added, for electrons “crossed” is subtracted. How often both counters click at once is given by the square of the length of the red arrow.</p><p><b>At the same place.</b> When both counters stand at the same spot, “straight” and “crossed” are the same possibility, with the same pointer. Something minus the same thing is zero: two electrons with the same spin never arrive at the same place at once. In general: two identical electrons are never in the same state. That is Pauli\'s law (1925). With opposite spin they are not in the same state and may share a place. That is why electrons fill an atom shell by shell, two per place; without this law there would be no chemistry.</p><p><b>Where the minus comes from.</b> It does not follow from the paths alone. Pauli proved in 1940: particles with half spin like the electron swap with minus, particles with whole spin like the light particle with plus. Pictorially, swapping the two is like a full turn, and for the electron that gives a minus (station 8). Feynman showed it with a belt: swap two objects joined by a belt, and the belt is afterwards twisted by one full turn.</p><p><b>On the U-cells</b> it is computed that the minus on swapping is possible without contradiction on a cord. Why it must hold is not shown there.</p>',
  q:{t:'Both counters stand at the same place. How often do two identical electrons arrive there at once?', opts:[{t:'Never', ok:1},{t:'Twice as often', fb:'That holds for light. For electrons one subtracts.'},{t:'As usual', fb:'The two pointers cancel exactly there.'}], ok:'Straight minus crossed gives zero there.'}},
 {title:'Only one path', sub:'Why a stone flies its course', min:3, mark:'k',
  text:'<p>A thrown stone, too, takes all paths from A to B, each with its pointer. The heavier the body, the faster the pointer turns as soon as a path departs from the usual course.</p><p>Then the pointers of almost all paths cancel each other. Only the paths near the course remain (yellow). That is how Feynman\'s sum turns into the course of a throw.</p><p>That is why it becomes ever more likely to find the body near the course (green), the heavier it is.</p><p class="note">Move the mass to the right.</p>',
  cap:'Not to scale. For a real stone the yellow band is unimaginably narrow.',
  live:function(o){ return (o.all ? 'Light: all '+o.n+' paths count.' : o.k+' of '+o.n+' drawn paths count.')+' Halfway, the body is inside the strip around the course with <b class="n">'+o.p+' %</b>.'; },
  more:'<p>The pointer of a path turns by its action divided by <span class="f">ħ</span> (Feynman, Hibbs 1965). For the drawn paths, which depart from the course by the height <span class="f">a</span>, the action in a uniform gravitational field grows by exactly <span class="f">m·π²·a²/(4T)</span>; <span class="f">T</span> is the flight time. For a stone of 1 g, one second of flight and <span class="f">a</span> = 1 mm that is about 4·10<sup>24</sup> rounds. Only at the course itself does the pointer not change when the path is bent a little; there the sum stays. That is the principle of least action, more precisely: of stationary action.</p><p>Yellow are the paths whose pointer is turned at most a quarter round against the pointer of the course. Green is where the body is found halfway if it is sent off as precisely as Heisenberg\'s rule allows (station 7): a bell of width <span class="f">σ = √(ħT/(2m))</span>. The percentage is the probability of then finding it inside the dashed strip. How the course bends in a gravitational field is shown on the page “Why things fall”.</p>',

 ],
 end: {sumH:'What matters',
   sum:'Particles spread as waves and take all paths at once. Nothing can stand still. An electron needs two turns; because swapping gives a minus, two identical ones never share a place. A heavy body takes only the path the sum leaves over: its course. On the U-cells, plus and minus become Feynman\'s wave.',
   newH:'What is new about it and what is not',

  return {V:V, step:function(){ draw(); var kk = kap(), ac = Math.sqrt(Math.PI/(2*kk)), k = 0; for (var i=0;i<ND;i++) if (Math.abs(-1 + 2*i/(ND - 1)) < ac) k++;
    return ST(10).live({k:k, n:ND, all:k === ND, p:dec(100*pIn(kk), 0)}); }, relabel:function(){}};
});

// Reihenfolge auf der Seite: Doppelspalt, zwei Wege, alle Wege, Wege aus Zellen, Plus oder Minus, viel dafür/dagegen, Heisenberg, Spin, zwei gleiche Elektronen, nur ein Weg
var ORDER = [0, 1, 2, 6, 7, 8, 3, 4, 9, 10];   // Pauli (5) bleibt in der Datei, steht aber nicht mehr auf der Seite
['de','en'].forEach(function(l){ TXT[l].stOrig = TXT[l].st.slice(); TXT[l].st = ORDER.map(function(i){ return TXT[l].stOrig[i]; }); });
SC = ORDER.map(function(i){ return SC[i]; });

// Vorschau auf der Startseite: Elektronen bauen das Streifenmuster auf
function Preview(box){
  var V = Canvas(box, {w:520, h:400}), c = V.cx, M = Slits(400), T = M.table(true), dots = [], acc = 0;
  return {V:V, step:function(dt){
    acc += dt*(dots.length < 30 ? 5 : 60); while (acc >= 1){ dots.push([M.XS + 6 + Math.random()*(V.W - M.XS - 12), M.sample(T)]); acc -= 1; }
    if (dots.length > 2500) dots = [];
    c.clearRect(0, 0, V.W, V.H); M.drawSetup(c, true, V.W); c.fillStyle = C.lamp; dots.forEach(function(d){ c.fillRect(d[0] - 1.2, d[1] - 1.2, 2.4, 2.4); });
  }};
}

// =====================================================================
// Ablauf: Start, Stationen, Auswertung
// =====================================================================
var NST = 10, S = {view:'start', st:0, res:[]}; for (var q0=0;q0<NST;q0++) S.res.push({});
var scenes = [], preview = null;
function pts(){ var p = 0; S.res.forEach(function(r){ p += r.p || 0; }); return p; }
var MAXP = 2*NST;

root.innerHTML = '';
var top = el('header', 'top'), logo = el('button', 'logo'), chain = el('nav', 'chain'), readout = el('div', 'readout');
logo.type = 'button';
logo.innerHTML = '<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="#ffc52e" stroke="#121b33" stroke-width="1.8"/><path d="M13 6.5V13l4.5 2.6" fill="none" stroke="#121b33" stroke-width="2.2" stroke-linecap="round"/></svg><span></span>';
logo.onclick = function(){ show('start'); };
var ptsEl = el('div', 'pts'), langEl = el('div', 'lang');
['de','en'].forEach(function(l){ var b = el('button', l === lang ? 'on' : '', l.toUpperCase()); b.type = 'button'; b.onclick = function(){ lang = l; Array.prototype.forEach.call(langEl.children, function(x){ x.className = x.textContent.toLowerCase() === lang ? 'on' : ''; }); relabel(); render(); }; langEl.appendChild(b); });
readout.appendChild(ptsEl); readout.appendChild(langEl);
top.appendChild(logo); top.appendChild(chain); top.appendChild(readout);
var main = el('div', 'main'); root.appendChild(top); root.appendChild(main);
var CLK = '<svg viewBox="0 0 22 22" aria-hidden="true"><circle class="cf" cx="11" cy="11" r="9"/><path class="ch" d="M11 5.5V11l3.6 2.1" fill="none"/></svg>';
for (var i=0;i<NST;i++) (function(i){ var b = el('button', '', CLK); b.type = 'button'; b.onclick = function(){ show('st', i); }; chain.appendChild(b); })(i);

// Szenen einmal bauen; ihre Werkbank bleibt erhalten und wird je nach Station eingehängt
SC.forEach(function(make, i){
  var bench = el('div', 'scene'), box = el('div'), row = el('div', 'sc-row'), cap = el('div', 'sc-cap');
  bench.appendChild(box); bench.appendChild(row); bench.appendChild(cap);
  var o = make(box, row); o.bench = bench; o.cap = cap; o.row = row; scenes.push(o);
});
var pvBench = el('div', 'scene'), pvBox = el('div'), pvCap = el('div', 'sc-cap'); pvBench.appendChild(pvBox); pvBench.appendChild(pvCap); preview = Preview(pvBox);

function relabel(){
  root.setAttribute('lang', lang);
  Array.prototype.forEach.call(langEl.children, function(x){ x.className = x.textContent.toLowerCase() === lang ? 'on' : ''; });
  logo.querySelector('span').textContent = L().ui.logo;
  scenes.forEach(function(o, i){
    o.row.querySelectorAll('[data-ui]').forEach(function(e){ e.textContent = L().ui[e.dataset.ui]; });
    o.cap.textContent = L().st[i].cap; if (o.relabel) o.relabel();
  });
  pvCap.textContent = L().start.cap;
}
function updateTop(){
  ptsEl.textContent = pts() + ' ' + L().ui.pts;
  Array.prototype.forEach.call(chain.children, function(b, i){ b.classList.toggle('is-done', !!S.res[i].done); b.classList.toggle('is-cur', S.view === 'st' && S.st === i); b.setAttribute('aria-label', (i+1) + ' ' + L().st[i].title); });
}
function show(v, i){ S.view = v; if (v === 'st') S.st = i; render(); var y = root.getBoundingClientRect().top + window.pageYOffset - 10; if (root.getBoundingClientRect().top < 0) window.scrollTo({top:y, behavior:'smooth'}); }

var liveEl = null;
function render(){
  main.innerHTML = ''; liveEl = null; var U = L().ui;
  if (S.view === 'start'){
    var T0 = L().start, g = el('div', 'start'), a = el('div');
    a.appendChild(el('div', 'eyebrow', T0.eyebrow));
    a.appendChild(el('h1', '', T0.h1a + '<span>' + T0.h1b + '</span>'));
    a.appendChild(el('p', 'lead', T0.lead));
    var f = el('div', 'facts'); T0.facts.forEach(function(x){ f.appendChild(el('span', '', x)); }); a.appendChild(f);
    var right = el('div'); right.style.display = 'flex'; right.style.flexDirection = 'column'; right.style.gap = '14px';
    right.appendChild(pvBench);
    var card = el('div', 'card'); card.appendChild(el('h2', '', T0.cardH)); card.appendChild(el('p', '', T0.card)); if (T0.note) card.appendChild(el('p', 'note', T0.note));
    var go = el('button', 'btn', U.start); go.type = 'button'; go.onclick = function(){ show('st', 0); }; var nv = el('div', 'nav'); nv.appendChild(go); card.appendChild(nv);
    right.appendChild(card);
    g.appendChild(a); g.appendChild(right); main.appendChild(g);
  } else if (S.view === 'st'){
    var i = S.st, T = L().st[i], R = S.res[i];
    var head = el('div', 'st-head');
    head.appendChild(el('div', 'eyebrow', U.stationOf(i+1, NST, T.min)));
    var tt = el('div', 'st-title'); tt.appendChild(el('span', 'st-no', ((i + 1 < 10 ? '0' : '') + (i+1)))); tt.appendChild(el('h2', '', T.title)); head.appendChild(tt);
    head.appendChild(el('div', 'st-sub', T.sub));
    var tags = el('div', 'tags'); tags.appendChild(el('span', 'tag ' + T.mark, '<i>' + U.markLabel + '</i> ' + U.marks[T.mark])); head.appendChild(tags);
    main.appendChild(head);
    var work = el('div', 'work'); work.appendChild(scenes[i].bench);
    var task = el('div', 'task');
    var tx = el('div'); tx.innerHTML = T.text; tx.style.display = 'flex'; tx.style.flexDirection = 'column'; tx.style.gap = '8px'; task.appendChild(tx);
    var live = el('div', 'fb'); live.innerHTML = '<span class="fb-i">i</span><span>' + (U.live ? '<span class="fb-p">' + U.live + '</span>' : '') + '<span class="lv"></span></span>'; task.appendChild(live); liveEl = live.querySelector('.lv');
    var det = el('details'); det.innerHTML = '<summary>' + U.more + '</summary>' + (T.more || ''); if (T.more) task.appendChild(det);
    if (i === NST-1 && scenes[NST-1].earth){ var E = scenes[NST-1].earth(); det.querySelectorAll('[data-earth]').forEach(function(x){ x.textContent = E[x.dataset.earth]; }); }
    task.appendChild(el('div', 'split'));
    var meta = el('div', 'task-meta'); meta.appendChild(el('span', '', U.task)); meta.appendChild(el('span', '', U.points(2))); task.appendChild(meta);
    task.appendChild(el('p', 'q', T.q.t));
    var opts = el('div', 'opts'), fb = el('div', 'fb'); fb.hidden = true;
    T.q.opts.forEach(function(o, k){
      var b = el('button', 'opt', '<span class="opt-k">' + 'ABCD'[k] + '</span><span class="opt-t">' + o.t + '</span>'); b.type = 'button';
      var picked = R.picked && R.picked.indexOf(k) >= 0;
      if (picked) b.classList.add(o.ok ? 'is-ok' : 'is-no');
      if (R.done){ b.setAttribute('aria-disabled', 'true'); if (!picked && !o.ok) b.classList.add('is-dim'); if (o.ok) b.classList.add('is-ok'); }
      b.onclick = function(){
        if (R.done || (R.picked && R.picked.indexOf(k) >= 0)) return;
        R.picked = (R.picked || []).concat([k]);
        if (o.ok){ R.done = true; R.p = R.picked.length === 1 ? 2 : (R.picked.length === 2 ? 1 : 0); }
        render(); updateTop();
      };
      opts.appendChild(b);
    });
    task.appendChild(opts);
    if (R.picked && R.picked.length){
      var lastK = R.picked[R.picked.length-1], lo = T.q.opts[lastK];
      fb.hidden = false;
      if (lo.ok){ fb.className = 'fb ok'; fb.innerHTML = '<span class="fb-i">✓</span><span><span class="fb-p">' + U.right + ' · ' + U.points(R.p) + '</span>' + T.q.ok + '</span>'; }
      else { fb.className = 'fb no'; fb.innerHTML = '<span class="fb-i">!</span><span><span class="fb-p">' + U.notYet + '</span>' + lo.fb + (R.picked.length === 1 ? ' ' + U.second : '') + '</span>'; }
    }
    task.appendChild(fb);
    var nav = el('div', 'nav'), bk = el('button', 'btn plain', U.back), nx = el('button', 'btn', i < NST-1 ? U.next : U.toEnd); bk.type = nx.type = 'button';
    bk.onclick = function(){ if (i === 0) show('start'); else show('st', i-1); };
    nx.onclick = function(){ if (i < NST-1) show('st', i+1); else show('end'); };
    nav.appendChild(bk); nav.appendChild(nx); task.appendChild(nav);
    work.appendChild(task); main.appendChild(work);
  } else {
    var E2 = L().end, p = pts(), sum = el('div', 'sum');
    var sc = el('div', 'card score'), circ = 2*Math.PI*80;
    sc.appendChild(el('div', 'eyebrow', U.sumTitle));
    sc.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 190 190"><circle class="ring-bg" cx="95" cy="95" r="80"/><circle class="ring" cx="95" cy="95" r="80" transform="rotate(-90 95 95)" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ*(1 - p/MAXP)).toFixed(1) + '"/><text class="big" x="95" y="105" text-anchor="middle">' + p + '</text><text class="of" x="95" y="132" text-anchor="middle">' + U.sumOf(p, MAXP).toUpperCase() + '</text></svg>');
    var rows = el('div'); rows.style.width = '100%';
    L().st.forEach(function(T, k){ var r = el('div', 'srow'); r.appendChild(el('span', 'n', k+1)); r.appendChild(el('span', 't', T.title)); r.appendChild(el('span', 'p', (S.res[k].p || 0) + '/2')); var bar = el('div', 'bar', '<i style="width:' + (50*(S.res[k].p || 0)) + '%"></i>'); r.appendChild(bar); r.style.cursor = 'pointer'; r.onclick = function(){ show('st', k); }; rows.appendChild(r); });
    sc.appendChild(rows); sc.appendChild(el('p', 'note', U.sumNote));
    var again = el('button', 'btn ghost small', U.again); again.type = 'button'; again.onclick = function(){ S.res = []; for (var q1=0;q1<NST;q1++) S.res.push({}); show('start'); updateTop(); }; sc.appendChild(again);
    var txt = el('div', 'card');
    var b1 = el('div', 'box'); b1.appendChild(el('h3', '', E2.sumH)); b1.appendChild(el('p', '', E2.sum)); txt.appendChild(b1);
    var b2 = el('div', 'box o'); b2.appendChild(el('h3', '', E2.openH)); b2.appendChild(el('p', '', E2.open)); txt.appendChild(b2);
    var d1 = el('details'); d1.innerHTML = '<summary>' + E2.newH + '</summary>' + E2.neu; txt.appendChild(d1);
    var d2 = el('details'); d2.innerHTML = '<summary>' + E2.srcH + '</summary><div class="src">' + E2.src + '</div>'; txt.appendChild(d2);
    sum.appendChild(sc); sum.appendChild(txt); main.appendChild(sum);
  }
  updateTop();
}

relabel(); render();
var last = 0;
function loop(now){
  var dt = Math.min(0.05, (now - last)/1000 || 0.016); last = now;
  var r = root.getBoundingClientRect(), vis = r.bottom > 0 && r.top < (window.innerHeight || 800);
  if (vis){
    if (S.view === 'start'){ if (preview.V.fit()) preview.step(dt); }
    else if (S.view === 'st'){ var o = scenes[S.st]; if (o.V.fit()){ var h = o.step(dt); if (liveEl && liveEl._h !== h){ liveEl.innerHTML = h; liveEl._h = h; } } }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', function(){ scenes.forEach(function(o){ o.V.cw = 0; }); preview.V.cw = 0; });
API.setLang = function(l){ lang = l; relabel(); render(); };
API.show = show;
API.stepScene = function(i, dt){ var o = scenes[i]; o.V.fit(); return o.step(dt); };
})();
</script>
