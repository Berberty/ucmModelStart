#ucm-fall{
  --bg:#e9edf4; --grid:#dbe2ee; --paper:#ffffff; --ink:#121b33; --ink2:#525f7b; --line:#cfd7e6;
  --lamp:#ffc52e; --lamp-edge:#cf9500; --lamp-ink:#221900;
  --el:#1d57d6; --el-soft:#e4ecff;
  --ok:#147a4b; --ok-bg:#dff3e7; --no:#bd2f2f; --no-bg:#fbe5e3; --warn-bg:#fff1c7; --warn:#8a5a00;
  --bench:#0d1630; --bench2:#16213f; --bench3:#22305a; --bench-ink:#d4dcf0; --bench-ink2:#8f9cc0;
  --f-display:"Barlow Condensed","DIN Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","DIN Alternate","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  position:relative;text-align:left;color:var(--ink);font:400 17px/1.45 var(--f-body);letter-spacing:normal;
  background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  border-radius:14px;overflow:clip;-webkit-text-size-adjust:100%}
#ucm-fall *{box-sizing:border-box}
#ucm-fall [hidden]{display:none!important}
#ucm-fall h1,#ucm-fall h2,#ucm-fall h3,#ucm-fall p{margin:0;padding:0;color:inherit;letter-spacing:inherit;text-transform:none}
#ucm-fall b,#ucm-fall strong{font-weight:600}
#ucm-fall button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
#ucm-fall :focus-visible{outline:3px solid var(--el);outline-offset:2px;border-radius:6px}
#ucm-fall a{color:var(--el)}

/* Kopfzeile */
#ucm-fall .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
#ucm-fall .logo{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 0;font:700 21px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
#ucm-fall .logo svg{width:26px;height:26px;flex:none}
#ucm-fall .chain{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
#ucm-fall .chain button{position:relative;padding:6px 0;width:38px;flex:0 1 38px;min-width:22px;display:flex;justify-content:center}
#ucm-fall .chain button::before{content:"";position:absolute;left:-50%;right:50%;top:16px;height:2px;background:var(--ink2);opacity:.55}
#ucm-fall .chain button:first-child::before{display:none}
#ucm-fall .chain svg{position:relative;width:22px;height:22px;overflow:visible}
#ucm-fall .chain .cf{fill:var(--paper);stroke:var(--ink2);stroke-width:1.6;transition:fill .4s}
#ucm-fall .chain .ch{stroke:var(--ink2);stroke-width:1.8;stroke-linecap:round}
#ucm-fall .chain .is-done .cf{fill:var(--lamp);stroke:var(--lamp-edge)}
#ucm-fall .chain .is-done .ch{stroke:var(--lamp-ink)}
#ucm-fall .chain .is-cur .cf{stroke:var(--el);stroke-width:2.6}
#ucm-fall .chain .is-cur::after{content:"";position:absolute;bottom:-2px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--el)}
#ucm-fall .readout{display:flex;align-items:center;gap:10px}
#ucm-fall .pts{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
#ucm-fall .lang{display:flex;gap:2px}
#ucm-fall .lang button{font:700 14px/1 var(--f-display);letter-spacing:.08em;padding:6px 7px;border-radius:7px;color:var(--ink2)}
#ucm-fall .lang button.on{background:var(--el-soft);color:var(--el)}

#ucm-fall .main{max-width:1140px;margin:0 auto;padding:18px 16px 40px}

/* Start */
#ucm-fall .start{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
#ucm-fall .eyebrow{font:600 14px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
#ucm-fall .start h1{font:700 clamp(46px,8.5vw,84px)/.86 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin-top:6px}
#ucm-fall .start h1 span{color:var(--el);display:block}
#ucm-fall .lead{font-size:18.5px;max-width:34em;margin-top:12px}
#ucm-fall .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font:600 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
#ucm-fall .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
#ucm-fall .card h2{font:700 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
#ucm-fall .note{font-size:14.5px;color:var(--ink2);line-height:1.4}

/* Station */
#ucm-fall .st-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
#ucm-fall .st-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#ucm-fall .st-no{font:700 54px/.82 var(--f-display);color:var(--el);font-variant-numeric:tabular-nums}
#ucm-fall .st-head h2{font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
#ucm-fall .st-sub{color:var(--ink2);font-size:16px}
#ucm-fall .tags{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
#ucm-fall .tag{display:inline-flex;gap:6px;align-items:baseline;padding:3px 10px;border-radius:99px;background:var(--el-soft);font-size:14.5px}
#ucm-fall .tag i{font:600 12.5px var(--f-display);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
#ucm-fall .tag.k{background:#e4ecff} #ucm-fall .tag.g{background:var(--ok-bg)} #ucm-fall .tag.m{background:var(--warn-bg)}

#ucm-fall .work{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#ucm-fall .scene{background:var(--bench);color:var(--bench-ink);border-radius:14px;padding:8px;border:1px solid var(--bench3);display:flex;flex-direction:column;gap:6px;min-width:0}
#ucm-fall .scene canvas{display:block;width:100%;height:auto;touch-action:manipulation}
#ucm-fall .sc-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:2px 6px 6px}
#ucm-fall .sc-cap{font-size:13.5px;line-height:1.35;color:var(--bench-ink2);padding:0 8px 6px;text-align:center}
#ucm-fall .sc-row label{display:flex;gap:8px;align-items:center;font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--bench-ink2)}
#ucm-fall .sc-row input[type=range]{width:150px;height:30px;accent-color:var(--lamp)}

#ucm-fall .task{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
#ucm-fall .task-meta{display:flex;justify-content:space-between;gap:10px;font:600 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
#ucm-fall .task p{line-height:1.45}
#ucm-fall .q{font-size:19px;line-height:1.36;font-weight:600}
#ucm-fall .split{height:1px;background:var(--line)}

#ucm-fall .opts{display:grid;gap:9px}
#ucm-fall .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--paper);line-height:1.38;transition:border-color .2s,background .2s}
#ucm-fall .opt:hover{border-color:var(--el)}
#ucm-fall .opt-k{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--el-soft);font:700 17px/1 var(--f-display)}
#ucm-fall .opt-t{flex:1;min-width:0;padding-top:2px}
#ucm-fall .opt.is-ok{border-color:var(--ok);background:var(--ok-bg)}
#ucm-fall .opt.is-no{border-color:var(--no);background:var(--no-bg)}
#ucm-fall .opt.is-ok .opt-k{background:var(--ok);color:#fff}
#ucm-fall .opt.is-no .opt-k{background:var(--no);color:#fff}
#ucm-fall .opt.is-dim{opacity:.5}
#ucm-fall .opt[aria-disabled="true"]{cursor:default}

#ucm-fall .fb{display:flex;gap:10px;padding:12px 14px;border-radius:12px;border-left:6px solid var(--el);background:var(--el-soft);line-height:1.42;font-size:16px}
#ucm-fall .fb .fb-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--el);color:#fff;margin-top:1px}
#ucm-fall .fb.ok{border-color:var(--ok);background:var(--ok-bg)} #ucm-fall .fb.ok .fb-i{background:var(--ok)}
#ucm-fall .fb.no{border-color:var(--no);background:var(--no-bg)} #ucm-fall .fb.no .fb-i{background:var(--no)}
#ucm-fall .fb .fb-p{display:block;font:700 14px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
#ucm-fall .fb.ok .fb-p{color:var(--ok)} #ucm-fall .fb.no .fb-p{color:var(--no)}
#ucm-fall .fb b.n{color:var(--el)}

#ucm-fall details{border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:15.5px;line-height:1.45}
#ucm-fall details[open]{background:#fafbfd}
#ucm-fall summary{cursor:pointer;font:700 15px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--el);list-style-position:inside}
#ucm-fall details p{margin-top:8px}
#ucm-fall .f{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;white-space:nowrap;font-size:1.05em}

#ucm-fall .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#ucm-fall .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:12px;border:2px solid var(--lamp-edge);background:var(--lamp);color:var(--lamp-ink);font:700 19px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#ucm-fall .btn:active{transform:translateY(1px)}
#ucm-fall .btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
#ucm-fall .btn.plain{background:none;border-color:transparent;color:var(--ink2);padding-left:6px;padding-right:6px}
#ucm-fall .btn.small{min-height:40px;padding:6px 14px;font-size:16px}
#ucm-fall .btn.onbench{min-height:40px;padding:6px 14px;font-size:16px;background:var(--bench2);border-color:var(--bench3);color:var(--bench-ink)}
#ucm-fall .btn.onbench[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}

/* Auswertung */
#ucm-fall .sum{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#ucm-fall .score{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#ucm-fall .score svg{width:190px;height:190px}
#ucm-fall .ring-bg{fill:none;stroke:var(--line);stroke-width:14}
#ucm-fall .ring{fill:none;stroke:var(--lamp);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s}
#ucm-fall .big{font:700 46px var(--f-display);fill:var(--ink)}
#ucm-fall .of{font:600 15px var(--f-display);letter-spacing:.1em;fill:var(--ink2)}
#ucm-fall .srow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
#ucm-fall .srow:first-of-type{border-top:0}
#ucm-fall .srow .n{font:700 28px/1 var(--f-display);color:var(--el)}
#ucm-fall .srow .t{font-weight:600;line-height:1.25;text-align:left}
#ucm-fall .srow .p{font:700 19px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
#ucm-fall .bar{grid-column:2 / 4;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
#ucm-fall .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
#ucm-fall .box{border-left:6px solid var(--el);background:var(--el-soft);border-radius:12px;padding:12px 14px}
#ucm-fall .box.o{border-color:var(--lamp-edge);background:var(--warn-bg)}
#ucm-fall .box h3,#ucm-fall .card h3{font:700 15px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
#ucm-fall ul{margin:.3em 0;padding-left:1.2em} #ucm-fall li{margin:.25em 0}
#ucm-fall .src{font-size:14.5px;color:var(--ink2)}

@media (min-width:920px){
  #ucm-fall .start{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}
  #ucm-fall .work{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:start}
  #ucm-fall .scene{position:sticky;top:64px}
  #ucm-fall .sum{grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
}
@media (max-width:560px){
  #ucm-fall{font-size:16.5px}
  #ucm-fall .logo span{display:none}
  #ucm-fall .top{gap:6px;padding:6px 10px}
  #ucm-fall .st-no{font-size:44px} #ucm-fall .st-head h2{font-size:28px}
  #ucm-fall .task{padding:14px} #ucm-fall .q{font-size:18px}
  #ucm-fall .main{padding:14px 10px 30px}
}
@media (prefers-reduced-motion:reduce){ #ucm-fall .ring{transition:none} }

(function(){
"use strict";
var TXT = {
de: {
 ui: {logo:'Warum die Dinge fallen', pts:'P', start:'Zur ersten Station', next:'Weiter', back:'Zurück', toEnd:'Zur Auswertung', again:'Noch einmal von vorn',
   stationOf:function(i,n,m){ return 'Station '+i+' von '+n+' · etwa '+m+' Minuten'; }, task:'Frage', points:function(p){ return p+' Punkte'; },
   right:'Richtig', notYet:'Noch nicht', second:'Zweiter Versuch: 1 Punkt.', marks:{k:'bekannt',g:'gerechnet',m:'Lesart des Modells'}, markLabel:'Herkunft',
   pause:'Pause', go:'Weiter', reset:'Zurück auf null', again5:'Von vorn', more:'Genauer', live:'Im Bild', height:'Höhe',
   electron:'Elektron', proton:'Proton', carbon:'Kohlenstoff', equal:'Alle gleich schnell', topfast:'Oben schneller', speed:'Tempo', throw:'Werfen', heavy:'Schwerer Stein mit', newton:'Newtons Bahn', crests:'Kämme',
   onestep:'Ein Takt', withmass:'Mit Masse', nomass:'Ohne Masse', probe:'Probe: Einstein', drop:'Uhr fallen lassen',
   sumTitle:'Auswertung', sumOf:function(p,m){ return 'von '+m+' Punkten'; }, sumNote:'Station antippen, um sie noch einmal zu sehen.'},
 start: {eyebrow:'Das U-Zellen-Modell · Seite 9 von 12', h1a:'Warum die', h1b:'Dinge fallen',
   lead:'Ein frei fallender Körper bewegt sich so, dass auf seiner Uhr möglichst viel Zeit vergeht. Das klingt, als hätte der Stein einen Plan. Aber ein Stein weiß nichts, und eine U-Zelle auch nicht. Es muss also eine Regel geben, bei der jedes Ding nur auf das achtet, was unmittelbar neben ihm geschieht. Diese Regel gibt es. Sie ist alt und stammt aus der Lehre vom Licht.',
   facts:['6 Stationen','rund 15 Minuten','12 Punkte'], cardH:'So geht es',
   card:'An jeder Station gibt es links etwas zum Ausprobieren und rechts eine Frage. Die richtige Antwort beim ersten Versuch bringt zwei Punkte, beim zweiten einen.',
   note:'Jede Station trägt eine Marke: <b>bekannt</b> heißt anerkannte Physik, <b>gerechnet</b> heißt in der Abhandlung nachgerechnet, <b>Lesart des Modells</b> heißt die Deutung des U-Zellen-Modells.',
   cap:'Ein Stein, gezeichnet als Welle: Seine Kämme kippen, und er läuft quer zu ihnen.'},
 st: [
 {title:'Oben gehen die Uhren schneller', sub:'Der Gang der Uhren', min:2, mark:'k',
  text:'<p>In der Nähe einer Masse gehen Uhren langsamer, und zwar umso langsamer, je tiefer sie hängen. Das ist keine Störung der Uhr. Es gilt für jede Uhr, für das Herz und für das Atom.</p><p class="note">Schieben Sie die obere Uhr hinauf und lassen Sie die Jahre im Zeitraffer laufen.</p>',
  cap:'Der Turm ist nicht maßstäblich. Die Zahlen sind gerechnet, nicht übertrieben.',
  live:function(o){ return 'Höhenunterschied <b class="n">'+o.h+'</b>. Die obere Uhr geht schneller um den Bruchteil <b class="n">'+o.fr+'</b>, das sind '+o.day+' am Tag und '+o.yr+' im Jahr. Für eine ganze Sekunde bräuchte es '+o.sec+' Jahre.'; },
  more:'<p>Im gleichförmigen Feld geht eine Uhr in der Höhe <span class="f">h</span> um den Bruchteil <span class="f">g·h / c²</span> schneller als eine am Boden, mit <span class="f">g = 9,81 m/s²</span> und <span class="f">c = 299 792 458 m/s</span>. Für einen Meter ist das <span class="f">1,09·10<sup>−16</sup></span>. Gemessen haben den Unterschied zuerst Pound und Rebka 1960 in einem Turm von 22,5 m Höhe.</p><p>Die Zeiger im Bild sehen gleich aus, weil der Unterschied viel zu klein ist, um ihn zu sehen.</p>',
  q:{t:'Eine Uhr hängt einen Meter höher als eine andere. Um wie viel geht sie in einem Jahr vor?',
     opts:[{t:'Um gut drei Milliardstel Sekunden.', ok:1},{t:'Um gut drei Millionstel Sekunden.', fb:'Das wäre tausendmal zu viel. So viel bringen erst rund tausend Meter Höhe.'},{t:'Um gar nichts. Eine gute Uhr geht überall gleich.', fb:'Auch die beste Uhr geht oben schneller. Das liegt nicht an der Uhr, sondern an der Zeit selbst.'},{t:'Um eine Sekunde.', fb:'Für eine ganze Sekunde bräuchte es knapp dreihundert Millionen Jahre.'}],
     ok:'Gut drei Milliardstel Sekunden im Jahr, für jeden Meter Höhe. Winzig, aber gemessen.'}},
 {title:'Jedes Ding ist eine Uhr', sub:'Materie schwingt', min:2, mark:'k',
  text:'<p>Was ist eine Uhr? Etwas, das gleichmäßig schwingt. Das tut alle Materie: Seit Louis de Broglie wissen wir, dass jedes Teilchen auch eine Welle ist. Man kann sie sich als kleine Zeiger denken, die sich drehen.</p><p>Ein Stein trägt also keine Uhr bei sich. Er <b>ist</b> eine Uhr, bis in das letzte Teilchen, und schwingt im Gang der Uhren an dem Ort, an dem er gerade ist.</p>',
  cap:'Die Zeiger drehen sich im Bild unvorstellbar viel langsamer als in Wirklichkeit.',
  live:function(o){ return o.name+' schwingt <b class="n">'+o.f+'</b> Mal in jeder Sekunde. Im Bild drehen sich die Zeiger um das '+o.slow+'-fache langsamer.'; },
  names:{e:'Ein Elektron', pr:'Ein Proton', c:'Ein Kohlenstoffatom'},
  more:'<p>Die Zahl ist die Masse mal <span class="f">c²</span>, geteilt durch die Planck-Konstante: <span class="f">f = m c² / h</span>. Die Phase einer Materiewelle läuft mit der Eigenzeit des Teilchens.</p><p><b>Im Modell:</b> Dass Materie auf den Zellen im Takt der Eigenzeit schwingt, ist in Teil LXXIV der Abhandlung gerechnet, bisher in einer Raumrichtung.</p>',
  q:{t:'Wie oft schwingt die Welle eines Elektrons in einer Sekunde?',
     opts:[{t:'Gut hundert Trillionen Mal.', ok:1},{t:'Fünfzigmal, wie der Strom aus der Steckdose.', fb:'Die Steckdose hat damit nichts zu tun. Die Welle eines Elektrons schwingt unvorstellbar viel schneller.'},{t:'Gar nicht. Nur Licht ist eine Welle.', fb:'Seit de Broglie weiß man: Auch jedes Teilchen ist eine Welle.'}],
     ok:'Rund 1,24·10<sup>20</sup> Mal in jeder Sekunde. Jedes Teilchen ist eine unvorstellbar schnelle Uhr.'}},
 {title:'Was ein Wellenkamm ist', sub:'Zeiger, die oben schneller drehen', min:3, mark:'k',
  text:'<p>Ein Wellenkamm ist nichts Eigenes. Er ist nur die Linie durch alle Stellen, an denen der Zeiger gerade nach oben steht (blau).</p><p>Drehen sich alle Reihen gleich schnell, steht diese Linie senkrecht. Drehen sich die oberen Reihen ein wenig schneller, legt sie sich schräg, und je länger es dauert, desto schräger. Eine Welle läuft immer quer zu ihren Kämmen (roter Pfeil).</p>',
  cap:'Der Unterschied zwischen oben und unten ist riesig übertrieben.',
  live:function(o){ return o.fast ? 'Die oberste Reihe ist <b class="n">'+o.lead+' Umdrehungen</b> voraus, darum liegt der Kamm dort um <b class="n">'+o.lead+' Wellenlängen</b> weiter rechts. Kein Zeiger hat seinen Platz verlassen.' : 'Alle Reihen drehen sich gleich schnell. Die Kämme stehen senkrecht, die Welle läuft geradeaus.'; },
  more:'<p>Bei einer Welle, die nach rechts läuft, ist die Zeigerstellung <span class="f">a = ω t − k x</span>. Mit dem Drehtempo <span class="f">ω(z)</span> in der Höhe <span class="f">z</span> liegt der Kamm bei <span class="f">x = (ω(z) t − 2πn) / k</span>. Er neigt sich um <span class="f">dx/dz = ω′ t / k</span>, mit der Zeit immer mehr. Das Bild rechnet genau diese Formel.</p><p><b>Wie am Strand:</b> Im flachen Wasser laufen Meereswellen langsamer. Der Teil des Kamms nahe am Ufer bleibt zurück, und der Kamm dreht sich, bis die Welle auf den Strand zuläuft.</p>',
  q:{t:'Die oberen Zeigerreihen drehen sich schneller als die unteren. Wohin läuft die Welle?',
     opts:[{t:'Schräg nach unten, zur Seite mit den langsameren Zeigern.', ok:1},{t:'Schräg nach oben, zu den schnelleren Zeigern.', fb:'Oben liegt der Kamm weiter vorn. Quer dazu zeigt die Laufrichtung nach unten.'},{t:'Geradeaus. Die Zeiger bleiben ja an ihrem Platz.', fb:'Die Zeiger bleiben an ihrem Platz, aber der Kamm legt sich schräg, und mit ihm dreht sich die Laufrichtung.'}],
     ok:'Die Welle biegt zur langsameren Seite ab, wie eine Meereswelle zum flachen Ufer.'}},
 {title:'Ein Stein voller Zeiger', sub:'Zeigerreihen im fliegenden Stein', min:2, mark:'k',
  text:'', cap:'', live:function(o){ return ''; },
  more:'<p>Im gleichförmigen Feld ist die Zeigerstellung <span class="f">a = (m g t/ħ) z − k₀ x + …</span>: Je höher <span class="f">z</span>, desto schneller läuft sie, genau um den Gang der Uhren in dieser Höhe. Die Kämme sind die Linien <span class="f">a = 2πn</span>; sie neigen sich um <span class="f">tan α = g t / v₀</span>. Das Bild rechnet diese Lösung der Schrödinger-Gleichung (Teil LXXVI); weggelassen ist nur der riesige gemeinsame Takt <span class="f">m c²/ħ</span>, der alle Zeiger gleich dreht.</p><p>Zeigerabstand und Wellenlänge sind riesig vergrößert. Die Neigung hängt nicht von ihnen ab.</p>',
  q:{t:'', opts:[], ok:''}},
 {title:'Der geworfene Stein', sub:'Der Fall als Welle', min:3, mark:'k',
  text:'<p>Ein waagrecht geworfener Stein ist eine solche Welle. Sein oberer Teil ist höher als sein unterer, und oben gehen die Uhren schneller. Seine Kämme kippen deshalb, oben nach vorn, und er läuft quer zu ihnen schräg nach unten.</p><p>Der Stein wird nicht gezogen. Treffen Sie den Korb!</p>',
  cap:'Gerechnet wird nur: quer zu den Kämmen laufen. Die Wellenlänge ist riesig vergrößert.',
  ready:'Tempo einstellen und werfen.',
  live:function(o){ return 'Neigung der Kämme: <b class="n">'+o.a+'°</b>'+(o.heavy?' beim leichten Stein (links, blau) und <b class="n">'+o.a2+'°</b> beim doppelt so schweren (rechts, grün). Er hat doppelt so viele Kämme und fliegt doch dieselbe Bahn.':'.')+(o.land?' <b>'+o.land+'</b>':'')+' Treffer: '+o.hits+' von '+o.tries+'.'; },
  hit:'Treffer!', miss:'Daneben.',
  more:'<p>Im gleichförmigen Feld drehen die Zeiger in der Höhe <span class="f">z</span> mit <span class="f">ω(z) = (m c²/ħ)(1 + g z/c²)</span>. Daraus folgt der Wellenvektor <span class="f">(k₀, −m g t/ħ)</span>, und der Stein läuft mit <span class="f">ħ/m</span> mal dem Wellenvektor, also mit <span class="f">(v₀, −g t)</span>: Das ist Newtons Wurfparabel. Die Neigung, <span class="f">tan α = g t / v₀</span>, hängt nicht von der Masse ab.</p><p>Dass Materiewellen oben vorauseilen, haben Colella, Overhauser und Werner 1975 an Neutronen gemessen. Die Erklärung des Falls über die Kämme haben Czarnecka und Czarnecki 2021 ausgeführt.</p><p>Im Bild ist nur die Richtung der Kämme gezeichnet; in Wirklichkeit wandern sie durch den Stein hindurch. Zahlen in Bildeinheiten.</p>',
  q:{t:'Ein doppelt so schwerer Stein wird genauso geworfen. Was geschieht?',
     opts:[{t:'Er fliegt dieselbe Bahn: Er hat doppelt so viele Kämme, und sie kippen genauso schnell.', ok:1},{t:'Er fällt doppelt so schnell, weil er schwerer ist.', fb:'Sein Vorsprung oben wächst zwar doppelt so schnell, aber er hat auch doppelt so viele Kämme. Die Neigung bleibt gleich.'},{t:'Er fällt langsamer, weil er träger ist.', fb:'Probieren Sie es aus: Mit „Schwerer Stein mit“ fliegen beide genau dieselbe Bahn.'}],
     ok:'Darum fallen alle Dinge gleich: Die Neigung der Kämme hängt nicht von der Masse ab.'}},
 {title:'Die Regel der Zelle', sub:'Ticken, einhüllen, nachrücken', min:3, mark:'g',
  text:'<p>Für die U-Zellen gilt dasselbe, und bei ihnen lässt es sich als Bauplan schreiben. Er stammt von Christiaan Huygens, der so im 17. Jahrhundert die Ausbreitung des Lichts erklärt hat. Im Bild läuft die Zeit nach oben; links außerhalb liegt eine Masse, hier ein Schwarzes Loch.</p><p><b>1 · Ticken.</b> Jede Zelle tickt einen Takt. Ihre <i>Schale</i> (rot) zeigt alle Orte, an denen sie dann sein kann.<br><b>2 · Einhüllen.</b> Der untere Rand aller Schalen ist das neue gemeinsame Jetzt (grün).<br><b>3 · Nachrücken.</b> Jede Zelle rückt zu dem Punkt, an dem ihre eigene Schale dieses Jetzt berührt.</p>',
  cap:'Waagrecht der Abstand r in Lochradien, so gestreckt, dass Licht überall unter 45° läuft. Antippen wählt eine Zelle.',
  phase:[function(m){ return '<b>1 · Ticken.</b>'+(m?' Nahe der Masse reicht die Schale höher: Derselbe Takt dauert dort länger.':' Ohne Masse sind alle Schalen gleich.'); },
         function(m){ return '<b>2 · Einhüllen.</b>'+(m?' Weil die Schalen links höher reichen, liegt das neue Jetzt schräg.':' Das neue Jetzt bleibt waagrecht.'); },
         function(m){ return '<b>3 · Nachrücken.</b>'+(m?' Der Berührpunkt liegt ein Stück zur Masse hin. Das ist der Fall.':' Der Berührpunkt liegt genau über der Zelle: Sie ruht.'); }],
  doneTxt:'Zehn Takte, immer dieselben drei Handgriffe. Keine Zelle kennt die Masse. Mit der Probe sehen Sie: Es sind Einsteins Fallbahnen.',
  num:function(o){ return 'Takt '+o.K+' · gewählte Zelle, Start bei r = '+o.r0+': nach der Regel r = <b class="n">'+o.r+'</b>'+(o.e?', nach Einstein r = <b class="n">'+o.e+'</b>':''); },
  toMass:'← zur Masse', noMass:'keine Masse', timeUp:'Zeit ↑',
  more:'<p>Ohne Masse ist die Schale eine Hyperbel; bei halbem Lichttempo dauert derselbe Takt für einen Zuschauer um gut ein Siebtel länger. Mit Masse ändert sich ein Einziges: Nahe der Masse reicht die Schale höher. Am Ende laufen die Zellen auf den Wegen, auf denen die meiste Zeit vergeht. Die längste Zeit ist das Ergebnis der Regel, nicht ihr Ziel.</p><p><b>Nachgerechnet:</b> Fünfzehn Zellen, zehn Takte, nahe einem Schwarzen Loch: Die Wege aus der Regel weichen von Einsteins Fallbahnen um weniger als ein Hundertstel des Lochradius ab. Der Rest kommt von der Grobheit der Rechnung. Jeder Takt besteht intern aus zehn kleinen Schritten derselben Regel.</p>',
  q:{t:'Woher weiß eine Zelle, wohin sie rücken muss?',
     opts:[{t:'Sie achtet nur auf ihre eigene Schale und das neue Jetzt gleich daneben.', ok:1},{t:'Sie kennt die Lage der Masse und hält darauf zu.', fb:'Keine Zelle kennt die Masse. Die Masse ändert nur, wie lang ein Takt an jedem Ort dauert.'},{t:'Sie probiert alle Wege aus und nimmt den mit der meisten Zeit.', fb:'Die längste Zeit kommt am Ende heraus, aber sie ist das Ergebnis der Regel, nicht ihr Ziel.'}],
     ok:'Ticken, einhüllen, nachrücken: Jede Zelle achtet nur auf ihre Umgebung, und heraus kommen Einsteins Fallbahnen.'}},
 {title:'Woher der Gang der Uhren kommt', sub:'Der Strom der Zellen', min:2, mark:'m',
  text:'<p>Bleibt die Frage vom Anfang: Warum gehen die Uhren unten langsamer? Im Modell strömen die Zellen auf die Masse zu, unten schneller als oben. Eine Uhr, die festgehalten wird, hat diesen Strom durch sich, und je schneller er an ihr vorbeiströmt, desto langsamer geht sie.</p><p>Weil die Zellen überall gleich dicht liegen, heißt schneller dasselbe wie mehr Zellen in jeder Sekunde. Eine Uhr, die mit dem Strom fällt, geht im Takt der Zellen, genau wie eine Uhr weit draußen.</p>',
  cap:'Höhen und Tempi im Bild sind nicht maßstäblich. r ist der Abstand in Lochradien.',
  live:function(o){ return o.since ? 'Seit dem Loslassen: ferne Uhr <b class="n">'+o.far+'</b> Runden, fallende Uhr <b class="n">'+o.fall+'</b> Runden. Sie geht im Takt der Zellen wie die ferne.' : 'Ferne Uhr: <b class="n">'+o.far+'</b> Runden. Festgehaltene Uhren von oben nach unten: '+o.fix+' Runden. Je schneller der Strom, desto langsamer die Uhr.'; },
  far:'ferne Uhr', fall:'fallende Uhr', horizon:'Horizont: Hier strömen die Zellen mit Lichtgeschwindigkeit', flow:'Strom', rate:'Uhr', cells:'Zellstrom',
  more:'<p>Bei den Abständen 16, 4, 2 und 4/3 Lochradien strömen die Zellen mit 0,25 · 0,50 · 0,71 · 0,87 der Lichtgeschwindigkeit, und die festgehaltenen Uhren gehen 0,97 · 0,87 · 0,71 · 0,50-mal so schnell wie eine ferne. Die Regel dahinter ist die Zeitdehnung gegen die Zellen, <span class="f">√(1 − v²/c²)</span>.</p><p><b>Die Erde:</b> An der Oberfläche strömen die Zellen mit <span data-earth="v"></span>, der Fluchtgeschwindigkeit. Eine festgehaltene Uhr geht dadurch um <span data-earth="d"></span> langsamer als eine ferne, das sind <span data-earth="day"></span> am Tag. Der Strom wird nach unten schneller, um <span data-earth="a"></span> in jeder Sekunde, und <span class="f">c²</span> mal dem Gefälle des Uhrengangs ergibt <span data-earth="c2"></span>: dieselbe Zahl, genau bis auf den Faktor <span class="f">1/√(1 − v²/c²)</span> des Stroms.</p><p><b>Warum der Strom so ist:</b> Das legt die Bilanz jeder Zelle fest. Abstand mal Quadrat des Tempos ist überall dieselbe Zahl, solange keine Materie dazwischen liegt. Daraus folgt die Fluchtgeschwindigkeit.</p><p><b>Einordnung:</b> Das Bild vom strömenden Raum ist rund hundert Jahre alt (Painlevé, Gullstrand). Dass die Zellen die strömenden Träger der Uhren sind, ist die Lesart des U-Zellen-Modells. Sie ist mit Einsteins Theorie verträglich, aber nicht für sich prüfbar: Welche Zellen strömen, kann keine Messung erkennen.</p>',
  q:{t:'Warum geht eine festgehaltene Uhr nahe der Masse langsamer?',
     opts:[{t:'Durch sie strömen die Zellen schneller, also mehr Zellen in jeder Sekunde.', ok:1},{t:'Die Masse zieht an ihren Zeigern.', fb:'Niemand zieht an den Zeigern. Die Uhr bewegt sich gegen den Strom der Zellen, und darum geht sie langsamer.'},{t:'Unten liegen die Zellen dichter.', fb:'Die Zellen liegen überall gleich dicht. Sie strömen unten nur schneller.'}],
     ok:'Eine festgehaltene Uhr bewegt sich gegen die Zellen. Je schneller der Strom, desto langsamer geht sie. Eine Uhr, die mitströmt, geht wie die ferne.'}}
 ],
 end: {sumH:'Worauf es ankommt',
   sum:'Jedes Ding ist eine Uhr und schwingt im Gang der Uhren an seinem Ort. Unten gehen die Uhren langsamer, weil dort der Strom der Zellen schneller durch alles fließt, was festgehalten wird. Deshalb kippen die Wellenkämme eines Dings, und es läuft quer zu ihnen nach unten, genau so, wie der Strom schneller wird. Die Zellen folgen derselben Regel: ticken, einhüllen, nachrücken. Keine kennt die Masse.',
   newH:'Was daran neu ist und was nicht',
   neu:'<p>Neu ist daran fast nichts. Dass die Uhren unten langsamer gehen, ist Einsteins Theorie. Dass Materie schwingt, ist de Broglie. Der Bauplan mit den Schalen ist Huygens. Dass der Strom die festgehaltenen Uhren bremst, ist das Bild vom strömenden Raum von Painlevé und Gullstrand. Dass Dinge fallen, <i>weil</i> ihre Materiewellen im ungleichen Gang der Uhren abbiegen wie Meereswellen am Strand, haben Anna Czarnecka und Andrzej Czarnecki 2021 ausgeführt.</p><p>Eigen ist die Lesart: Die U-Zellen sind die Träger der Uhren, und die Regel der Zellzeit ist Huygens\' Bauplan, nur anders gesagt.</p>',
   openH:'Was offen bleibt',
   open:'Der Strom erklärt den Gang der Uhren, und die Bilanz erklärt, wie die Masse den Strom formt. Warum aber jede Zelle diese Bilanz einhält, sagt das Modell nicht. Sie folgt aus gesetzten Annahmen: dass keine Messung sagen kann, welche Zellen ruhen, oder dass jede Zelle ein festes Volumen hat. Gerechnet ist die Regel für eine ruhende, kugelförmige Masse und in einer Raumrichtung.',
   srcH:'Belege',
   src:'<ul><li>A. P. Czarnecka, A. Czarnecki: Gravitational time dilation, free fall, and matter waves. Am. J. Phys. 89, 634 (2021).</li><li>R. Colella, A. W. Overhauser, S. A. Werner: Observation of gravitationally induced quantum interference. Phys. Rev. Lett. 34, 1472 (1975).</li><li>R. V. Pound, G. A. Rebka: Apparent weight of photons. Phys. Rev. Lett. 4, 337 (1960).</li><li>A. J. S. Hamilton, J. P. Lisle: The river model of black holes. Am. J. Phys. 76, 519 (2008).</li><li>C. Huygens: Traité de la lumière. Leiden 1690.</li><li>Mehr: Kapitel I.10 im Büchlein „The Universe in a Dot, Zweite Fassung“ und Teil LXXVI der Abhandlung „Das U-Zellen-Modell“.</li></ul>'}
},

 ui: {logo:'Why things fall', pts:'P', start:'To the first station', next:'Next', back:'Back', toEnd:'To the results', again:'Start over',

 start: {eyebrow:'The U-cell model · Page 9 of 12', h1a:'Why things', h1b:'fall',
   lead:'A freely falling body moves in such a way that as much time as possible passes on its clock. That sounds as if the stone had a plan. But a stone knows nothing, and neither does a U-cell. So there must be a rule in which every thing pays attention only to what happens right beside it. This rule exists. It is old, and it comes from the theory of light.',
   facts:['6 stations','about 15 minutes','12 points'], cardH:'How it works',
   card:'At every station there is something to try out on the left and a question on the right. The right answer at the first try earns two points, at the second one.',
   note:'Every station carries a mark: <b>known</b> means accepted physics, <b>computed</b> means checked by calculation in the treatise, <b>reading of the model</b> means the interpretation of the U-cell model.',
   cap:'A stone drawn as a wave: its crests tilt, and it travels at right angles to them.'},
 st: [
 {title:'Higher up, clocks run faster', sub:'The rate of the clocks', min:2, mark:'k',
  text:'<p>Near a mass clocks run slower, and the slower, the lower they hang. That is not a fault of the clock. It holds for every clock, for the heart and for the atom.</p><p class="note">Slide the upper clock up and let the years run in fast motion.</p>',
  cap:'The tower is not to scale. The numbers are computed, not exaggerated.',
  live:function(o){ return 'Difference in height <b class="n">'+o.h+'</b>. The upper clock runs faster by the fraction <b class="n">'+o.fr+'</b>, that is '+o.day+' a day and '+o.yr+' a year. A whole second would take '+o.sec+' years.'; },
  more:'<p>In a uniform field a clock at height <span class="f">h</span> runs faster than one on the ground by the fraction <span class="f">g·h / c²</span>, with <span class="f">g = 9.81 m/s²</span> and <span class="f">c = 299,792,458 m/s</span>. For one meter that is <span class="f">1.09·10<sup>−16</sup></span>. The difference was first measured by Pound and Rebka in 1960 in a tower 22.5 m high.</p><p>The hands in the picture look the same because the difference is far too small to see.</p>',
  q:{t:'A clock hangs one meter higher than another. By how much does it gain in a year?',
     opts:[{t:'By a good three billionths of a second.', ok:1},{t:'By a good three millionths of a second.', fb:'That would be a thousand times too much. That much takes about a thousand meters of height.'},{t:'By nothing at all. A good clock runs the same everywhere.', fb:'Even the best clock runs faster higher up. That is not due to the clock but to time itself.'},{t:'By one second.', fb:'A whole second would take just under three hundred million years.'}],
     ok:'A good three billionths of a second a year, for every meter of height. Tiny, but measured.'}},
 {title:'Every thing is a clock', sub:'Matter oscillates', min:2, mark:'k',
  text:'<p>What is a clock? Something that oscillates evenly. All matter does that: since Louis de Broglie we have known that every particle is also a wave. One can picture it as small pointers that turn.</p><p>So a stone does not carry a clock with it. It <b>is</b> a clock, down to the last particle, and it oscillates at the rate of the clocks at the place where it happens to be.</p>',
  cap:'In the picture the pointers turn unimaginably more slowly than in reality.',
  live:function(o){ return o.name+' oscillates <b class="n">'+o.f+'</b> times in every second. In the picture the pointers turn '+o.slow+' times more slowly.'; },
  names:{e:'An electron', pr:'A proton', c:'A carbon atom'},
  more:'<p>The number is the mass times <span class="f">c²</span>, divided by Planck\'s constant: <span class="f">f = m c² / h</span>. The phase of a matter wave runs with the proper time of the particle.</p><p><b>In the model:</b> That matter oscillates on the cells in step with proper time is computed in Part LXXIV of the treatise, so far in one direction of space.</p>',
  q:{t:'How often does the wave of an electron oscillate in one second?',
     opts:[{t:'More than a hundred quintillion times.', ok:1},{t:'Fifty times, like the current from the wall socket.', fb:'The socket has nothing to do with it. The wave of an electron oscillates unimaginably faster.'},{t:'Not at all. Only light is a wave.', fb:'Since de Broglie we know: every particle is also a wave.'}],
     ok:'About 1.24·10<sup>20</sup> times in every second. Every particle is an unimaginably fast clock.'}},
 {title:'What a wave crest is', sub:'Pointers that turn faster at the top', min:3, mark:'k',
  text:'<p>A wave crest is nothing of its own. It is only the line through all places at which the pointer happens to point upward (blue).</p><p>If all rows turn equally fast, this line is vertical. If the upper rows turn a little faster, it comes to lie at a slant, and the longer it lasts, the more slanted. A wave always travels at right angles to its crests (red arrow).</p>',
  cap:'The difference between top and bottom is hugely exaggerated.',
  live:function(o){ return o.fast ? 'The top row is <b class="n">'+o.lead+' turns</b> ahead, so the crest there lies <b class="n">'+o.lead+' wavelengths</b> farther to the right. No pointer has left its place.' : 'All rows turn equally fast. The crests are vertical, the wave travels straight ahead.'; },
  more:'<p>In a wave traveling to the right the pointer position is <span class="f">a = ω t − k x</span>. With the turning rate <span class="f">ω(z)</span> at height <span class="f">z</span> the crest lies at <span class="f">x = (ω(z) t − 2πn) / k</span>. It tilts by <span class="f">dx/dz = ω′ t / k</span>, more and more with time. The picture computes exactly this formula.</p><p><b>As on the beach:</b> In shallow water sea waves travel more slowly. The part of the crest near the shore falls behind, and the crest turns until the wave runs toward the beach.</p>',
  q:{t:'The upper rows of pointers turn faster than the lower ones. Where does the wave travel?',
     opts:[{t:'Slanting downward, toward the side with the slower pointers.', ok:1},{t:'Slanting upward, toward the faster pointers.', fb:'At the top the crest lies farther forward. At right angles to it the direction of travel points downward.'},{t:'Straight ahead. The pointers stay in their places after all.', fb:'The pointers stay in their places, but the crest comes to lie at a slant, and with it the direction of travel turns.'}],
     ok:'The wave bends toward the slower side, like a sea wave toward the shallow shore.'}},
 {title:'A stone full of pointers', sub:'Rows of pointers in a flying stone', min:2, mark:'k',
  text:'', cap:'', live:function(o){ return ''; },
  more:'<p>In a uniform field the pointer position is <span class="f">a = (m g t/ħ) z − k₀ x + …</span>: the higher <span class="f">z</span>, the faster it runs, exactly by the rate of the clocks at that height. The crests are the lines <span class="f">a = 2πn</span>; they tilt by <span class="f">tan α = g t / v₀</span>. The picture computes this solution of the Schrödinger equation (Part LXXVI); left out is only the huge common beat <span class="f">m c²/ħ</span> that turns all pointers alike.</p><p>Pointer spacing and wavelength are hugely enlarged. The tilt does not depend on them.</p>',
  q:{t:'', opts:[], ok:''}},
 {title:'The thrown stone', sub:'Falling as a wave', min:3, mark:'k',
  text:'<p>A stone thrown horizontally is such a wave. Its upper part is higher than its lower part, and higher up clocks run faster. So its crests tilt, forward at the top, and it travels at right angles to them, slanting downward.</p><p>The stone is not pulled. Hit the basket!</p>',
  cap:'All that is computed: travel at right angles to the crests. The wavelength is hugely enlarged.',
  ready:'Set the speed and throw.',
  live:function(o){ return 'Tilt of the crests: <b class="n">'+o.a+'°</b>'+(o.heavy?' for the light stone (left, blue) and <b class="n">'+o.a2+'°</b> for the one twice as heavy (right, green). It has twice as many crests and still flies the same path.':'.')+(o.land?' <b>'+o.land+'</b>':'')+' Hits: '+o.hits+' of '+o.tries+'.'; },
  hit:'Hit!', miss:'Missed.',
  more:'<p>In a uniform field the pointers at height <span class="f">z</span> turn at <span class="f">ω(z) = (m c²/ħ)(1 + g z/c²)</span>. From this follows the wave vector <span class="f">(k₀, −m g t/ħ)</span>, and the stone travels at <span class="f">ħ/m</span> times the wave vector, that is at <span class="f">(v₀, −g t)</span>: Newton\'s parabola. The tilt, <span class="f">tan α = g t / v₀</span>, does not depend on the mass.</p><p>That matter waves run ahead at the top was measured with neutrons by Colella, Overhauser and Werner in 1975. The explanation of falling through the crests was worked out by Czarnecka and Czarnecki in 2021.</p><p>Only the direction of the crests is drawn; in reality they move through the stone. Numbers in picture units.</p>',
  q:{t:'A stone twice as heavy is thrown in the same way. What happens?',
     opts:[{t:'It flies the same path: it has twice as many crests, and they tilt just as fast.', ok:1},{t:'It falls twice as fast because it is heavier.', fb:'Its lead at the top does grow twice as fast, but it also has twice as many crests. The tilt stays the same.'},{t:'It falls more slowly because it is more sluggish.', fb:'Try it: with “Add heavy stone” both fly exactly the same path.'}],
     ok:'That is why all things fall alike: the tilt of the crests does not depend on the mass.'}},
 {title:'The rule of the cell', sub:'Tick, envelop, move up', min:3, mark:'g',
  text:'<p>For the U-cells the same holds, and with them it can be written as a construction plan. It comes from Christiaan Huygens, who explained the propagation of light this way in the 17th century. In the picture time runs upward; to the left outside lies a mass, here a black hole.</p><p><b>1 · Tick.</b> Every cell ticks one tick. Its <i>shell</i> (red) shows all places where it can then be.<br><b>2 · Envelop.</b> The lower edge of all shells is the new common now (green).<br><b>3 · Move up.</b> Every cell moves to the point at which its own shell touches this now.</p>',
  cap:'Horizontally the distance r in radii of the hole, stretched so that light travels at 45° everywhere. Tap to select a cell.',
  phase:[function(m){ return '<b>1 · Tick.</b>'+(m?' Near the mass the shell reaches higher: the same tick lasts longer there.':' Without a mass all shells are alike.'); },
         function(m){ return '<b>2 · Envelop.</b>'+(m?' Because the shells on the left reach higher, the new now lies at a slant.':' The new now stays horizontal.'); },
         function(m){ return '<b>3 · Move up.</b>'+(m?' The touching point lies a little toward the mass. That is falling.':' The touching point lies exactly above the cell: it is at rest.'); }],
  doneTxt:'Ten ticks, always the same three steps. No cell knows the mass. With the check you see: these are Einstein\'s paths of fall.',
  num:function(o){ return 'Tick '+o.K+' · selected cell, start at r = '+o.r0+': from the rule r = <b class="n">'+o.r+'</b>'+(o.e?', by Einstein r = <b class="n">'+o.e+'</b>':''); },
  toMass:'← toward the mass', noMass:'no mass', timeUp:'time ↑',
  more:'<p>Without a mass the shell is a hyperbola; at half the speed of light the same tick lasts a good seventh longer for an onlooker. With a mass one single thing changes: near the mass the shell reaches higher. In the end the cells travel on the paths on which the most time passes. The longest time is the result of the rule, not its aim.</p><p><b>Computed:</b> Fifteen cells, ten ticks, near a black hole: the paths from the rule deviate from Einstein\'s paths of fall by less than a hundredth of the radius of the hole. The remainder comes from the coarseness of the calculation. Internally every tick consists of ten small steps of the same rule.</p>',
  q:{t:'How does a cell know where to move?',
     opts:[{t:'It pays attention only to its own shell and to the new now right beside it.', ok:1},{t:'It knows where the mass is and heads for it.', fb:'No cell knows the mass. The mass only changes how long a tick lasts at each place.'},{t:'It tries all paths and takes the one with the most time.', fb:'The longest time comes out in the end, but it is the result of the rule, not its aim.'}],
     ok:'Tick, envelop, move up: every cell pays attention only to its surroundings, and Einstein\'s paths of fall come out.'}},
 {title:'Where the rate of the clocks comes from', sub:'The flow of the cells', min:2, mark:'m',
  text:'<p>There remains the question from the beginning: why do clocks run slower lower down? In the model the cells flow toward the mass, faster lower down than higher up. A clock that is held fast has this flow passing through it, and the faster it flows past, the slower the clock runs.</p><p>Because the cells lie equally densely everywhere, faster means the same as more cells in every second. A clock that falls with the flow runs in step with the cells, exactly like a clock far out.</p>',
  cap:'Heights and speeds in the picture are not to scale. r is the distance in radii of the hole.',
  live:function(o){ return o.since ? 'Since letting go: distant clock <b class="n">'+o.far+'</b> rounds, falling clock <b class="n">'+o.fall+'</b> rounds. It runs in step with the cells, like the distant one.' : 'Distant clock: <b class="n">'+o.far+'</b> rounds. Clocks held fast from top to bottom: '+o.fix+' rounds. The faster the flow, the slower the clock.'; },
  far:'distant clock', fall:'falling clock', horizon:'Horizon: here the cells flow at the speed of light', flow:'flow', rate:'clock', cells:'cell flow',
  more:'<p>At distances of 16, 4, 2 and 4/3 radii of the hole the cells flow at 0.25 · 0.50 · 0.71 · 0.87 of the speed of light, and the clocks held fast run 0.97 · 0.87 · 0.71 · 0.50 times as fast as a distant one. The rule behind this is time dilation relative to the cells, <span class="f">√(1 − v²/c²)</span>.</p><p><b>The Earth:</b> At the surface the cells flow at <span data-earth="v"></span>, the escape velocity. A clock held fast therefore runs slower than a distant one by <span data-earth="d"></span>, which is <span data-earth="day"></span> a day. The flow becomes faster downward, by <span data-earth="a"></span> in every second, and <span class="f">c²</span> times the gradient of the clock rate gives <span data-earth="c2"></span>: the same number, exactly up to the factor <span class="f">1/√(1 − v²/c²)</span> of the flow.</p><p><b>Why the flow is like this:</b> That is fixed by the balance of every cell. Distance times the square of the speed is the same number everywhere, as long as no matter lies in between. The escape velocity follows from this.</p><p><b>Classification:</b> The picture of flowing space is about a hundred years old (Painlevé, Gullstrand). That the cells are the flowing carriers of the clocks is the reading of the U-cell model. It agrees with Einstein\'s theory but cannot be tested on its own: no measurement can tell which cells are flowing.</p>',
  q:{t:'Why does a clock held fast near the mass run slower?',
     opts:[{t:'The cells flow through it faster, so more cells in every second.', ok:1},{t:'The mass pulls at its hands.', fb:'Nobody pulls at the hands. The clock moves relative to the flow of the cells, and that is why it runs slower.'},{t:'Lower down the cells lie more densely.', fb:'The cells lie equally densely everywhere. They only flow faster lower down.'}],
     ok:'A clock held fast moves relative to the cells. The faster the flow, the slower it runs. A clock that flows along runs like the distant one.'}}
 ],
 end: {sumH:'What matters',
   sum:'Every thing is a clock and oscillates at the rate of the clocks at its place. Lower down clocks run slower, because there the flow of the cells runs faster through everything that is held fast. So the wave crests of a thing tilt, and it travels at right angles to them downward, exactly as the flow becomes faster. The cells follow the same rule: tick, envelop, move up. None knows the mass.',
   newH:'What is new about it and what is not',
   neu:'<p>Almost nothing about it is new. That clocks run slower lower down is Einstein\'s theory. That matter oscillates is de Broglie. The construction plan with the shells is Huygens. That the flow slows the clocks held fast is the picture of flowing space of Painlevé and Gullstrand. That things fall <i>because</i> their matter waves bend in the unequal rate of the clocks like sea waves on the beach was worked out by Anna Czarnecka and Andrzej Czarnecki in 2021.</p><p>Mine is the reading: the U-cells are the carriers of the clocks, and the rule of the cell time is Huygens\' construction plan, only said differently.</p>',
   openH:'What remains open',
   open:'The flow explains the rate of the clocks, and the balance explains how the mass shapes the flow. But why every cell keeps to this balance, the model does not say. It follows from assumptions that are set: that no measurement can say which cells are at rest, or that every cell has a fixed volume. The rule is computed for a mass at rest, spherical, and in one direction of space.',
   srcH:'Sources',
   src:'<ul><li>A. P. Czarnecka, A. Czarnecki: Gravitational time dilation, free fall, and matter waves. Am. J. Phys. 89, 634 (2021).</li><li>R. Colella, A. W. Overhauser, S. A. Werner: Observation of gravitationally induced quantum interference. Phys. Rev. Lett. 34, 1472 (1975).</li><li>R. V. Pound, G. A. Rebka: Apparent weight of photons. Phys. Rev. Lett. 4, 337 (1960).</li><li>A. J. S. Hamilton, J. P. Lisle: The river model of black holes. Am. J. Phys. 76, 519 (2008).</li><li>C. Huygens: Traité de la lumière. Leiden 1690.</li><li>More: Chapter I.10 of the booklet “The Universe in a Dot, Second Version” and Part LXXVI of the treatise “The U-Cell Model”.</li></ul>'}
}};

  {text:'<p>Ein Wellenkamm ist die Linie durch alle Zeiger, die nach oben zeigen. Drehen die oberen schneller, kippt er. Die Welle läuft quer zum Kamm.</p>', cap:'Unterschied stark übertrieben.',

  {text:'<p>Nun sitzen die Zeigerreihen in einem fliegenden Stein. Sein oberer Teil ist höher, dort gehen die Uhren schneller. Die Kämme kippen, und der Stein biegt nach unten ab.</p>', cap:'Zeiger und Wellenlänge stark vergrößert.',

    var T0 = L().start, g = el('div', 'start'), a = el('div');
    a.appendChild(el('div', 'eyebrow', T0.eyebrow));
    a.appendChild(el('h1', '', T0.h1a + '<span>' + T0.h1b + '</span>'));
    a.appendChild(el('p', 'lead', T0.lead));
    var f = el('div', 'facts'); T0.facts.forEach(function(x){ f.appendChild(el('span', '', x)); }); a.appendChild(f);
    var right = el('div'); right.style.display = 'flex'; right.style.flexDirection = 'column'; right.style.gap = '14px';
    right.appendChild(pvBench);
    var card = el('div', 'card'); card.appendChild(el('h2', '', T0.cardH)); card.appendChild(el('p', '', T0.card)); if (T0.note) card.appendChild(el('p', 'note', T0.note));
    var go = el('button', 'btn', U.start); go.type = 'button'; go.onclick = function(){ show('st', 0); }; var nv = el('div', 'nav'); nv.appendChild(go); card.appendChild(nv);
    right.appendChild(card);
    g.appendChild(a); g.appendChild(right); main.appendChild(g);
  } else if (S.view === 'st'){
    var i = S.st, T = L().st[i], R = S.res[i];
    var head = el('div', 'st-head');
    head.appendChild(el('div', 'eyebrow', U.stationOf(i+1, NST, T.min)));
    var tt = el('div', 'st-title'); tt.appendChild(el('span', 'st-no', ('0' + (i+1)))); tt.appendChild(el('h2', '', T.title)); head.appendChild(tt);
    head.appendChild(el('div', 'st-sub', T.sub));
    var tags = el('div', 'tags'); tags.appendChild(el('span', 'tag ' + T.mark, '<i>' + U.markLabel + '</i> ' + U.marks[T.mark])); head.appendChild(tags);
    main.appendChild(head);
    var work = el('div', 'work'); work.appendChild(scenes[i].bench);
    var task = el('div', 'task');
    var tx = el('div'); tx.innerHTML = T.text; tx.style.display = 'flex'; tx.style.flexDirection = 'column'; tx.style.gap = '8px'; task.appendChild(tx);
    var live = el('div', 'fb'); live.innerHTML = '<span class="fb-i">i</span><span>' + (U.live ? '<span class="fb-p">' + U.live + '</span>' : '') + '<span class="lv"></span></span>'; task.appendChild(live); liveEl = live.querySelector('.lv');
    var det = el('details'); det.innerHTML = '<summary>' + U.more + '</summary>' + (T.more || ''); if (T.more) task.appendChild(det);
    if (i === NST-1){ var E = scenes[NST-1].earth(); det.querySelectorAll('[data-earth]').forEach(function(x){ x.textContent = E[x.dataset.earth]; }); }
    task.appendChild(el('div', 'split'));
    var meta = el('div', 'task-meta'); meta.appendChild(el('span', '', U.task)); meta.appendChild(el('span', '', U.points(2))); task.appendChild(meta);
    task.appendChild(el('p', 'q', T.q.t));
    var opts = el('div', 'opts'), fb = el('div', 'fb'); fb.hidden = true;
    T.q.opts.forEach(function(o, k){
      var b = el('button', 'opt', '<span class="opt-k">' + 'ABCD'[k] + '</span><span class="opt-t">' + o.t + '</span>'); b.type = 'button';
      var picked = R.picked && R.picked.indexOf(k) >= 0;
      if (picked) b.classList.add(o.ok ? 'is-ok' : 'is-no');
      if (R.done){ b.setAttribute('aria-disabled', 'true'); if (!picked && !o.ok) b.classList.add('is-dim'); if (o.ok) b.classList.add('is-ok'); }
      b.onclick = function(){
        if (R.done || (R.picked && R.picked.indexOf(k) >= 0)) return;
        R.picked = (R.picked || []).concat([k]);
        if (o.ok){ R.done = true; R.p = R.picked.length === 1 ? 2 : (R.picked.length === 2 ? 1 : 0); }
        render(); updateTop();
      };
      opts.appendChild(b);
    });
    task.appendChild(opts);
    if (R.picked && R.picked.length){
      var lastK = R.picked[R.picked.length-1], lo = T.q.opts[lastK];
      fb.hidden = false;
      if (lo.ok){ fb.className = 'fb ok'; fb.innerHTML = '<span class="fb-i">✓</span><span><span class="fb-p">' + U.right + ' · ' + U.points(R.p) + '</span>' + T.q.ok + '</span>'; }
      else { fb.className = 'fb no'; fb.innerHTML = '<span class="fb-i">!</span><span><span class="fb-p">' + U.notYet + '</span>' + lo.fb + (R.picked.length === 1 ? ' ' + U.second : '') + '</span>'; }
    }
    task.appendChild(fb);
    var nav = el('div', 'nav'), bk = el('button', 'btn plain', U.back), nx = el('button', 'btn', i < NST-1 ? U.next : U.toEnd); bk.type = nx.type = 'button';
    bk.onclick = function(){ if (i === 0) show('start'); else show('st', i-1); };
    nx.onclick = function(){ if (i < NST-1) show('st', i+1); else show('end'); };
    nav.appendChild(bk); nav.appendChild(nx); task.appendChild(nav);
    work.appendChild(task); main.appendChild(work);
  } else {
    var E2 = L().end, p = pts(), sum = el('div', 'sum');
    var sc = el('div', 'card score'), circ = 2*Math.PI*80;
    sc.appendChild(el('div', 'eyebrow', U.sumTitle));
    sc.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 190 190"><circle class="ring-bg" cx="95" cy="95" r="80"/><circle class="ring" cx="95" cy="95" r="80" transform="rotate(-90 95 95)" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ*(1 - p/MAXP)).toFixed(1) + '"/><text class="big" x="95" y="105" text-anchor="middle">' + p + '</text><text class="of" x="95" y="132" text-anchor="middle">' + U.sumOf(p, MAXP).toUpperCase() + '</text></svg>');
    var rows = el('div'); rows.style.width = '100%';
    L().st.forEach(function(T, k){ var r = el('div', 'srow'); r.appendChild(el('span', 'n', k+1)); r.appendChild(el('span', 't', T.title)); r.appendChild(el('span', 'p', (S.res[k].p || 0) + '/2')); var bar = el('div', 'bar', '<i style="width:' + (50*(S.res[k].p || 0)) + '%"></i>'); r.appendChild(bar); r.style.cursor = 'pointer'; r.onclick = function(){ show('st', k); }; rows.appendChild(r); });
    sc.appendChild(rows); sc.appendChild(el('p', 'note', U.sumNote));
    var again = el('button', 'btn ghost small', U.again); again.type = 'button'; again.onclick = function(){ S.res = []; for (var q1=0;q1<NST;q1++) S.res.push({}); show('start'); updateTop(); }; sc.appendChild(again);
    var txt = el('div', 'card');
    var b1 = el('div', 'box'); b1.appendChild(el('h3', '', E2.sumH)); b1.appendChild(el('p', '', E2.sum)); txt.appendChild(b1);
    var b2 = el('div', 'box o'); b2.appendChild(el('h3', '', E2.openH)); b2.appendChild(el('p', '', E2.open)); txt.appendChild(b2);
    var d1 = el('details'); d1.innerHTML = '<summary>' + E2.newH + '</summary>' + E2.neu; txt.appendChild(d1);
    var d2 = el('details'); d2.innerHTML = '<summary>' + E2.srcH + '</summary><div class="src">' + E2.src + '</div>'; txt.appendChild(d2);
    sum.appendChild(sc); sum.appendChild(txt); main.appendChild(sum);
  }
  updateTop();
}

relabel(); render();
var last = 0;
function loop(now){
  var dt = Math.min(0.05, (now - last)/1000 || 0.016); last = now;
  var r = root.getBoundingClientRect(), vis = r.bottom > 0 && r.top < (window.innerHeight || 800);
  if (vis){
    if (S.view === 'start'){ if (preview.V.fit()) preview.step(dt); }
    else if (S.view === 'st'){ var o = scenes[S.st]; if (o.V.fit()){ var h = o.step(dt); if (liveEl && liveEl._h !== h){ liveEl.innerHTML = h; liveEl._h = h; } } }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', function(){ scenes.forEach(function(o){ o.V.cw = 0; }); preview.V.cw = 0; });
API.setLang = function(l){ lang = l; relabel(); render(); };
API.show = show;
API.stepScene = function(i, dt){ var o = scenes[i]; o.V.fit(); return o.step(dt); };
})();
</script>
